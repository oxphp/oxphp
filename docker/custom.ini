; oxphp configuration
;
; Mount this file via docker-compose:
;   volumes:
;     - ./custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro

; The PHP base image already loads OPcache: compiled into PHP on 8.5 and 8.6,
; a shared extension enabled by conf.d/docker-php-ext-opcache.ini on 8.4
; (verify with `php -m` → "Zend OPcache").
; Do NOT add `zend_extension=opcache` here — PHP would report it as already
; loaded (8.4) or fail to find opcache.so (8.5, 8.6) on every PHP invocation.
; The [opcache] configuration section below is applied to the already-loaded
; extension.

[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.file_update_protection = 0
opcache.jit_buffer_size = 64M
opcache.jit = tracing

; Default optimization level is 0x7FFEBFFF (all passes). Pass 4
; ("block optimization", bit 0x8) elides ZEND_DO_UCALL opcodes for
; user functions with empty/trivial bodies. This breaks the decorator
; observer, which needs every call to reach zend_observer_fcall_begin.
; Clearing bit 0x8 keeps every other optimization but preserves the
; call opcode so decorators fire reliably.
opcache.optimization_level = 0x7FFEBFF7

; Preloading
opcache.preload = /var/www/html/preload.php
opcache.preload_user = www-data

[Session]
session.save_path = /tmp
session.use_cookies = 1
session.use_only_cookies = 1
session.name = PHPSESSID
session.auto_start = 0
session.gc_maxlifetime = 1440
session.gc_probability = 1
session.gc_divisor = 1000
session.cache_limiter =
