services:
  oxphp:
    build:
      context: .
      args:
        # PHP minor version. Maps to upstream php:${PHP_VERSION}-zts-alpine${ALPINE_VERSION}.
        # Override with: PHP_VERSION=8.5 docker compose build (NB: PHP 8.5 is
        # currently broken — oxphp's Rust FFI bindings need updating for the
        # 8.5 ABI; tracked as a follow-up).
        PHP_VERSION: "8.4"
        # Alpine base version. Override with: ALPINE_VERSION=3.23 docker compose build
        ALPINE_VERSION: "3.23"
        # Extra Cargo features (space-separated), e.g. "plugin-debug"
        # Default features (see Cargo.toml `default`) include the "php"
        # aggregate (plugin-apm, plugin-async) plus plugin-profiler.
        CARGO_FEATURES: ""
    ports:
      - "80:80"
      - "443:443"
      - "9090:9090"
    volumes:
      - ./www:/var/www/html:ro
      - ./oxphp.ini:/usr/local/etc/php/conf.d/oxphp.ini:ro
      - ./certs:/etc/ssl/oxphp:ro
    environment:
      # ── Server ────────────────────────────────────────────────────

      # Address and port the server binds to.
      # - LISTEN_ADDR=0.0.0.0:80

      # Root directory for serving files and PHP scripts.
      # - DOCUMENT_ROOT=/var/www/html/public

      # Front-controller file. Determines routing mode:
      #   (unset)      — traditional: direct file mapping, / → index.php or index.html
      #   index.php    — framework: all requests → index.php, direct .php access blocked
      #   index.html   — SPA: missing files → index.html, .php still executes
      # - INDEX_FILE=index.php

      # PHP executor backend.
      #   sapi  — execute PHP via custom SAPI (default, requires php feature)
      #   stub  — return static response without PHP (benchmarking)
      # - EXECUTOR=sapi

      # ── Tokio Runtime ─────────────────────────────────────────────

      # Number of Tokio worker threads.
      #   0  — auto-detect: CPU / 2 (min 1), multi-threaded (default)
      #   1  — single-threaded current_thread runtime (lowest overhead)
      #   N  — multi-threaded runtime with N worker threads + work-stealing
      # - TOKIO_WORKERS=0

      # ── PHP Workers (only used when EXECUTOR=sapi with SapiExecutor) ──

      # PHP worker thread count. Formats:
      #   0        — auto-detect: CPU / 2 (min 1), static pool
      #   N        — fixed N worker threads
      #   MIN:MAX  — dynamic pool: scales between MIN and MAX based on load
      # - PHP_WORKERS=0

      # Idle timeout in seconds before scaling down a dynamic worker (MIN:MAX mode).
      # - PHP_WORKERS_IDLE_SECONDS=30

      # Bounded channel capacity between HTTP and PHP workers.
      # Requests beyond this limit get 529. Default: PHP_WORKERS * 128.
      # - QUEUE_CAPACITY=0

      # ── Connections ───────────────────────────────────────────────

      # Maximum concurrent connections. New connections are rejected above this limit.
      # - MAX_CONNECTIONS=10000

      # Seconds to wait for in-flight connections to finish during graceful shutdown.
      # - DRAIN_TIMEOUT_SECONDS=30

      # ── Logging ───────────────────────────────────────────────────

      # Log level filter: trace, debug, info, warn, error.
      - LOG_LEVEL=info

      # Per-request access log (method, path, status, duration).
      # Values: "all" (every request), "error" (4xx/5xx only), empty/unset = off.
      # - ACCESS_LOG=all

      # ── Internal Server ───────────────────────────────────────────

      # Address for the internal endpoints (/health, /metrics, /config).
      # Unset = internal server disabled.
      - INTERNAL_ADDR=0.0.0.0:9090

      # ── Timeouts ──────────────────────────────────────────────────

      # Max seconds to receive HTTP headers after connection is accepted.
      - HEADER_TIMEOUT_SECONDS=5

      # Max seconds for the entire request (including PHP execution). 0 = no limit.
      - REQUEST_TIMEOUT_SECONDS=120

      # ── Rate Limiting ─────────────────────────────────────────────

      # Max requests per IP within the rate window. 0 = rate limiting disabled.
      # - RATE_LIMIT=0

      # Rate limiting window in seconds.
      # - RATE_WINDOW_SECONDS=60

      # ── TLS ───────────────────────────────────────────────────────

      # Path to PEM-encoded TLS certificate. Both TLS_CERT and TLS_KEY must be set.
      # - TLS_CERT=/etc/ssl/oxphp/server.pem

      # Path to PEM-encoded TLS private key.
      # - TLS_KEY=/etc/ssl/oxphp/server.key

      # ── Response ──────────────────────────────────────────────────

      # Brotli compression quality level (0-11). 0 disables compression.
      # - COMPRESSION_LEVEL=4

      # Directory containing custom error pages ({status}.html, e.g. 404.html, 500.html).
      # - ERROR_PAGES_DIR=/var/www/errors

      # ── Async Promises ──────────────────────────────────────────────

      # Number of dedicated async worker threads for oxphp_async().
      # 0 = async pool disabled (default).
      # - ASYNC_WORKERS=0

      # Bounded channel capacity for pending async tasks.
      # Tasks are rejected when full. Default: ASYNC_WORKERS * 64.
      # - ASYNC_QUEUE_CAPACITY=0

      # ── Worker Mode ────────────────────────────────────────────────

      # PHP file that boots the application and calls oxphp_worker().
      # When set, workers use persistent mode (no php_request_shutdown between requests).
      # - WORKER_FILE=/var/www/html/worker.php

      # Max requests before recycling a worker (0 = unlimited).
      # - WORKER_MAX_REQUESTS=0

      # Max memory (MB) before recycling a worker (0 = unlimited).
      # - WORKER_MAX_MEMORY_MIB=0

      # ── HTTP Object API ─────────────────────────────────────────

      # Whether PHP superglobals ($_GET, $_POST, $_COOKIE, $_FILES, $_SERVER)
      # are populated. When false, only oxphp_http_request() provides request data.
      # Default: true (full backward compatibility).
      # - SUPERGLOBALS_ENABLED=true

      # ── Trace Context (W3C) ────────────────────────────────────

      # Enable W3C Trace Context propagation (traceparent/tracestate).
      # Parses incoming headers, generates trace_id/span_id, injects into
      # response headers and PHP $_SERVER (OXPHP_TRACE_ID, OXPHP_SPAN_ID).
      # Automatically enabled when OTEL_ENABLED=true.
      # - TRACE_CONTEXT=false

      # ── OpenTelemetry (requires CARGO_FEATURES: "plugin-otel") ──

      # Enable OpenTelemetry span export. Implies TRACE_CONTEXT=true.
      # - OTEL_ENABLED=true

      # OTLP collector endpoint.
      # - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317

      # Export protocol: "grpc" (default, port 4317) or "http/protobuf" (port 4318).
      # - OTEL_EXPORTER_OTLP_PROTOCOL=grpc

      # Export timeout in milliseconds.
      # - OTEL_EXPORTER_OTLP_TIMEOUT=10000

      # Additional headers for exporter authentication (key=value,key2=value2).
      # Required by hosted backends (Grafana Cloud, New Relic, Honeycomb).
      # - OTEL_EXPORTER_OTLP_HEADERS=

      # Service identity in traces.
      # - OTEL_SERVICE_NAME=oxphp
      # - OTEL_SERVICE_VERSION=

      # Additional resource attributes (key=value,key2=value2).
      # Example: deployment.environment=production,host.name=web-01
      # - OTEL_RESOURCE_ATTRIBUTES=

      # Sampling strategy: always_on, always_off, traceidratio, parentbased_traceidratio.
      # - OTEL_TRACES_SAMPLER=parentbased_traceidratio

      # Sampling ratio for ratio-based samplers (0.0–1.0).
      # - OTEL_TRACES_SAMPLER_ARG=1.0

      # ── APM (requires CARGO_FEATURES: "plugin-apm") ─────────────

      # Enable APM: error capture, auto-instrumentation, PHP SDK.
      # Requires OTEL_ENABLED=true.
      # - OTEL_APM_ENABLED=true

      # Slow query threshold in milliseconds. Queries above this get oxphp.db.slow=true.
      # - OTEL_APM_SLOW_QUERY_MS=100

      # Record bind parameters in db.params span attribute.
      # - OTEL_APM_DB_CAPTURE_PARAMS_ENABLED=false
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ── Jaeger — tracing backend (UI at http://localhost:16686) ──
#  jaeger:
#    image: jaegertracing/all-in-one:latest
#    ports:
#      - "16686:16686"   # Jaeger UI
#      - "4317:4317"     # OTLP gRPC receiver
#    environment:
#      - COLLECTOR_OTLP_ENABLED=true
