name: PR Checks

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt -- --check

  clippy:
    name: Clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no-default
            flags: "--no-default-features --all-targets"
            php_id: ""
          # decorator-test rides along here because nothing else builds it:
          # it is deliberately not part of `php` (only the decorators test
          # image enables it), it gates no Rust tests of its own, and the
          # code it does gate — the repeatable ALL-target test decorator and
          # its attribute registration — would otherwise stay uncompiled
          # until someone builds that image by hand. The php8.5 row below
          # still covers the plain default set.
          - name: default-php8.4
            flags: "--all-targets --features decorator-test"
            php_id: "80400"
          - name: default-php8.5
            flags: "--all-targets"
            php_id: "80500"
    steps:
      - uses: actions/checkout@v5
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Rust version
        id: rust
        run: echo "hash=$(rustc --version | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: clippy-${{ matrix.name }}-${{ steps.rust.outputs.hash }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: clippy-${{ matrix.name }}-${{ steps.rust.outputs.hash }}-
      - name: Clippy
        env:
          CLIPPY_FLAGS: ${{ matrix.flags }}
          PHP_VERSION_ID: ${{ matrix.php_id }}
        run: cargo clippy $CLIPPY_FLAGS -- -D warnings

  # Two runs, because one feature set cannot cover both ends.
  #
  # `--no-default-features` is the only configuration that links without
  # libphp.so, which isn't installed on the runner — but `php` is also what
  # pulls in plugin-apm / plugin-async / plugin-profiler / plugin-shared, and
  # nothing else in a default build does, so dropping it silently drops their
  # tests too. Silently: a name filter over a module that was never built
  # reports "0 passed; N filtered out" and exits 0. None of the four links
  # anything of its own, so the second run enables them explicitly and picks
  # up several hundred tests the bare run never builds.
  #
  # The bare run stays because it is the only one that *executes* tests
  # against the no-plugin build — the `cfg(not(feature = "plugin-apm"))`
  # fallback in src/server/connection.rs is compiled by the no-default clippy
  # row too, but nothing there runs.
  #
  # Out of reach of both runs: src/php/{bindings,bootstrap,sapi} and
  # executor::sapi — 26 tests, all of them in sapi.rs. The rest of src/php/
  # (fiber, header_match, heartbeat, request_decode, supervisor,
  # unhandled_exception, worker_registry) is NOT php-gated and already runs
  # in both. Closing the remaining 26 needs libphp.so, i.e. a container job;
  # the clippy matrix above type-checks that code in the meantime — though
  # not the `cfg(not(feature = "plugin-*"))` arms nested inside it, which no
  # buildable feature combination reaches at all.
  #
  # decorator-test is not here either — it gates no Rust tests and is
  # deliberately not part of `php`, so it is type-checked by a clippy row
  # instead of changing what these runs test against.
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Rust version
        id: rust
        run: echo "hash=$(rustc --version | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ steps.rust.outputs.hash }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: test-${{ steps.rust.outputs.hash }}-
      - name: Test (no features)
        run: cargo test --no-default-features
      # The feature list is checked against Cargo.toml rather than just
      # documented: a fifth plugin added to `php = [...]` and not added here
      # would silently stop being tested, which is the exact defect this step
      # exists to prevent. A prose comment does not fail a build; this does.
      - name: Test (host-buildable plugin features)
        run: |
          HOST_FEATURES=plugin-apm,plugin-async,plugin-profiler,plugin-shared
          php_enables=$(sed -n 's/^php = \[\(.*\)\]$/\1/p' Cargo.toml | tr -d ' "')
          if [ "$php_enables" != "$HOST_FEATURES" ]; then
            echo "::error::the php feature enables [$php_enables]; this step runs [$HOST_FEATURES]"
            echo "::error::add the new feature here if it builds without libphp.so, or record why it cannot"
            exit 1
          fi
          cargo test --no-default-features --features "$HOST_FEATURES"

  # Always runs so the required status check is always reported, but the
  # expensive steps are gated on changes to license-relevant files. PRs that
  # don't touch them finish in seconds with a no-op message.
  licenses:
    name: Licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Detect license-relevant changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            cargo:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - 'about.toml'
              - 'about.hbs'
              - 'THIRD_PARTY_LICENSES.html'
              - '.github/workflows/pr.yml'

      - name: No license-relevant changes — skipping
        if: steps.filter.outputs.cargo != 'true'
        run: echo "No changes to Cargo.toml/Cargo.lock/deny.toml/about.{toml,hbs}/THIRD_PARTY_LICENSES.html/pr.yml — skipping cargo-deny + cargo-about."

      - name: cargo-deny (licenses, advisories, sources)
        if: steps.filter.outputs.cargo == 'true'
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories sources

      - name: Rust version (for cache key)
        if: steps.filter.outputs.cargo == 'true'
        id: rust
        run: echo "hash=$(rustc --version | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache cargo-about install
        if: steps.filter.outputs.cargo == 'true'
        id: cache-about
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-about
          key: cargo-about-0.6-${{ steps.rust.outputs.hash }}

      - name: Install cargo-about
        if: steps.filter.outputs.cargo == 'true' && steps.cache-about.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-about --version '^0.6'

      # Registry cache so `cargo fetch` is a no-op on cache hit. Keyed by
      # Cargo.lock — same convention as the clippy/test jobs.
      - if: steps.filter.outputs.cargo == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: licenses-${{ steps.rust.outputs.hash }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: licenses-${{ steps.rust.outputs.hash }}-

      # Populate the registry so `cargo about generate --offline` (which runs
      # `cargo metadata --offline` internally) can resolve the dep graph.
      - name: Prefetch dependencies
        if: steps.filter.outputs.cargo == 'true'
        run: cargo fetch --locked

      - name: Regenerate THIRD_PARTY_LICENSES.html
        if: steps.filter.outputs.cargo == 'true'
        # --offline makes generation deterministic by skipping clearlydefined.io
        # fetches; otherwise harvest-cache state can shift which crate's copy
        # of a shared license text becomes first_of_kind between runs.
        run: cargo about generate --offline about.hbs -o /tmp/notices.html

      - name: Verify committed THIRD_PARTY_LICENSES.html is fresh
        if: steps.filter.outputs.cargo == 'true'
        run: |
          if ! diff -q /tmp/notices.html THIRD_PARTY_LICENSES.html >/dev/null; then
            echo "::error::THIRD_PARTY_LICENSES.html is stale. Regenerate locally:"
            echo "::error::  cargo about generate about.hbs -o THIRD_PARTY_LICENSES.html"
            echo "::error::then commit the result alongside your Cargo.toml/Cargo.lock change."
            diff -u THIRD_PARTY_LICENSES.html /tmp/notices.html | head -200 || true
            exit 1
          fi

  # Two things nothing else catches: a documentation link that points at a page
  # or heading which no longer exists, and llms.txt / llms-full.txt left behind
  # by a docs edit. Both are pure shell over the working tree — no toolchain, no
  # cache, a couple of seconds — so they run on every PR rather than behind a
  # path filter, which also covers a link added to the README by a Rust-only PR.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Links resolve
        run: |
          if ! scripts/check-links.sh; then
            echo "::error::Broken links listed above. Reproduce locally with scripts/check-links.sh"
            exit 1
          fi

      - name: llms.txt and llms-full.txt match docs/
        run: |
          if ! scripts/gen-llms-txt.sh --check; then
            echo "::error::Generated files are stale. Run scripts/gen-llms-txt.sh and commit the result."
            exit 1
          fi
