name: Build Packages

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64

    runs-on: ${{ matrix.runner }}

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "version=0.0.0-dev.${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build packages
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.pkg
          platforms: linux/${{ matrix.arch }}
          provenance: false
          push: false
          build-args: VERSION=${{ steps.version.outputs.version }}
          outputs: type=local,dest=./packages
          cache-from: type=gha,scope=pkg-${{ matrix.arch }}
          cache-to: type=gha,scope=pkg-${{ matrix.arch }},mode=max

      - name: List packages
        run: ls -lh packages/

      - name: Smoke test .deb
        if: matrix.arch == 'amd64'
        run: |
          DEB=$(find packages -name '*.deb' | head -1)
          docker run --rm -v "$PWD/packages:/pkg" debian:bookworm-slim bash -c "
            apt-get update && apt-get install -y --no-install-recommends /pkg/$(basename $DEB) && \
            oxphp --version
          "

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: packages/*
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: List all packages
        run: ls -lh packages/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*
