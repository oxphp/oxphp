name: Weekly Rebuild

# Picks up upstream PHP patch releases by re-running the release pipeline
# against a pinned oxphp version, for every (oxphp, PHP, distribution)
# triple listed in .github/supported-versions.yml: each Alpine version, and
# each Debian codename for the releases whose tag has the Debian Dockerfile.

on:
  schedule:
    - cron: '0 3 * * 0'   # Sunday 03:00 UTC
  workflow_dispatch:      # manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: oxphp/oxphp

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: read supported-versions.yml and emit the matrix
  # ──────────────────────────────────────────────────────────────
  plan:
    runs-on: ubuntu-24.04
    outputs:
      build_matrix: ${{ steps.compute.outputs.build_matrix }}
      merge_matrix: ${{ steps.compute.outputs.merge_matrix }}
      suite_matrix: ${{ steps.compute.outputs.suite_matrix }}
    steps:
      - uses: actions/checkout@v5

      - name: Install yq
        run: |
          sudo curl -sL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Verify all upstream base images exist
        run: |
          FAIL=0
          DISTROS="$(yq '.alpine_versions[] | "alpine" + .' .github/supported-versions.yml) $(yq '.debian_versions[]' .github/supported-versions.yml)"
          for PHP in $(yq '.php_versions[]' .github/supported-versions.yml); do
            for DISTRO in $DISTROS; do
              BASE="php:${PHP}-zts-${DISTRO}"
              if ! docker manifest inspect "$BASE" >/dev/null 2>&1; then
                echo "error: upstream base image not found: $BASE" >&2
                FAIL=1
              else
                echo "ok: $BASE"
              fi
            done
          done
          if [[ "$FAIL" -ne 0 ]]; then
            echo "one or more upstream base images are missing — manual investigation required" >&2
            exit 1
          fi

      - name: Compute build, merge and suite matrices
        id: compute
        run: |
          BUILD_JSON="["
          MERGE_JSON="["
          SUITE_JSON="["
          FIRST_B=1
          FIRST_M=1
          FIRST_S=1
          for OXPHP in $(yq '.oxphp_versions[]' .github/supported-versions.yml); do
            # Each entry is <distro>:<Dockerfile>. A release tagged before the
            # Debian Dockerfile existed is rebuilt on Alpine only.
            DISTROS=""
            for ALPINE in $(yq '.alpine_versions[]' .github/supported-versions.yml); do
              DISTROS+=" alpine${ALPINE}:docker/release/alpine/Dockerfile"
            done
            git fetch --quiet --depth=1 origin "refs/tags/v${OXPHP}:refs/tags/v${OXPHP}"
            if git cat-file -e "v${OXPHP}:docker/release/debian/Dockerfile" 2>/dev/null; then
              for DEBIAN in $(yq '.debian_versions[]' .github/supported-versions.yml); do
                DISTROS+=" ${DEBIAN}:docker/release/debian/Dockerfile"
              done
            else
              echo "v${OXPHP} has no docker/release/debian/Dockerfile; Alpine only"
            fi
            for PHP in $(yq '.php_versions[]' .github/supported-versions.yml); do
              for ENTRY in $DISTROS; do
                DISTRO="${ENTRY%%:*}"
                DOCKERFILE="${ENTRY#*:}"
                if [[ $FIRST_M -eq 0 ]]; then MERGE_JSON+=","; fi
                FIRST_M=0
                MERGE_JSON+="{\"oxphp\":\"$OXPHP\",\"php\":\"$PHP\",\"distro\":\"$DISTRO\"}"
                # The PHP suites run on the Alpine image only: their health
                # checks call wget, which the Debian image does not have.
                if [[ "$DISTRO" == alpine* ]]; then
                  if [[ $FIRST_S -eq 0 ]]; then SUITE_JSON+=","; fi
                  FIRST_S=0
                  SUITE_JSON+="{\"oxphp\":\"$OXPHP\",\"php\":\"$PHP\",\"distro\":\"$DISTRO\"}"
                fi
                for ARCH in amd64 arm64; do
                  RUNNER="ubuntu-24.04"
                  if [[ "$ARCH" == "arm64" ]]; then RUNNER="ubuntu-24.04-arm"; fi
                  if [[ $FIRST_B -eq 0 ]]; then BUILD_JSON+=","; fi
                  FIRST_B=0
                  BUILD_JSON+="{\"oxphp\":\"$OXPHP\",\"php\":\"$PHP\",\"distro\":\"$DISTRO\",\"dockerfile\":\"$DOCKERFILE\",\"arch\":\"$ARCH\",\"runner\":\"$RUNNER\"}"
                done
              done
            done
          done
          BUILD_JSON+="]"
          MERGE_JSON+="]"
          SUITE_JSON+="]"
          {
            echo "build_matrix=$BUILD_JSON"
            echo "merge_matrix=$MERGE_JSON"
            echo "suite_matrix=$SUITE_JSON"
          } >> "$GITHUB_OUTPUT"
          echo "build_matrix: $BUILD_JSON"
          echo "merge_matrix: $MERGE_JSON"
          echo "suite_matrix: $SUITE_JSON"

  # ──────────────────────────────────────────────────────────────
  # Job 2: per-(oxphp, PHP, distro, arch) build
  # ──────────────────────────────────────────────────────────────
  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout tagged oxphp version
        uses: actions/checkout@v5
        with:
          ref: v${{ matrix.oxphp }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve upstream base image digest
        id: base_digest
        env:
          PHP_MINOR: ${{ matrix.php }}
          DISTRO: ${{ matrix.distro }}
        run: |
          BASE="php:${PHP_MINOR}-zts-${DISTRO}"
          # Parse default human-readable output — the `{{.Manifest.Digest}}`
          # template is silently ignored in newer docker buildx builds and
          # would cause multi-line $GITHUB_OUTPUT content that GitHub rejects.
          DIGEST=$(docker buildx imagetools inspect "$BASE" 2>/dev/null | awk '/^Digest:/{print $2; exit}')
          if [[ -z "$DIGEST" ]]; then
            echo "error: could not resolve digest for $BASE" >&2
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Resolve last-published upstream digest
        id: published
        env:
          OXPHP_VER: ${{ matrix.oxphp }}
          PHP_MINOR: ${{ matrix.php }}
          DISTRO: ${{ matrix.distro }}
        run: |
          # Last weekly publish records the upstream digest in the manifest
          # annotation `org.oxphp.upstream-digest` (set by the publish step
          # below). Empty annotation => first run for this triple; treat
          # as new (proceed with full build).
          LAST=$(docker buildx imagetools inspect \
            "${REGISTRY}/${IMAGE_NAME}:${OXPHP_VER}-php${PHP_MINOR}-${DISTRO}" --raw 2>/dev/null \
            | jq -r '.annotations["org.oxphp.upstream-digest"] // ""' || echo "")
          echo "digest=$LAST" >> "$GITHUB_OUTPUT"

      - name: Decide whether to rebuild
        id: decide
        env:
          UPSTREAM: ${{ steps.base_digest.outputs.digest }}
          PUBLISHED: ${{ steps.published.outputs.digest }}
        run: |
          if [[ "$UPSTREAM" = "$PUBLISHED" && -n "$PUBLISHED" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Upstream digest unchanged ($UPSTREAM); skipping build."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Rebuilding: upstream=$UPSTREAM published=${PUBLISHED:-(none)}"
          fi

      - name: Resolve PHP patch version from base image
        if: steps.decide.outputs.skip != 'true'
        id: php_patch
        env:
          PHP_MINOR: ${{ matrix.php }}
          DISTRO: ${{ matrix.distro }}
          ARCH: ${{ matrix.arch }}
        run: |
          BASE="php:${PHP_MINOR}-zts-${DISTRO}"
          docker pull --platform "linux/${ARCH}" "$BASE"
          PATCH=$(docker run --rm --platform "linux/${ARCH}" "$BASE" php -r 'echo PHP_VERSION;')
          if [[ ! "$PATCH" =~ ^${PHP_MINOR}\.[0-9]+$ ]]; then
            echo "error: unexpected PHP version: $PATCH (expected ${PHP_MINOR}.x)" >&2
            exit 1
          fi
          echo "patch=$PATCH" >> "$GITHUB_OUTPUT"

      - name: Build image from ${{ matrix.dockerfile }} (cache key includes base digest)
        if: steps.decide.outputs.skip != 'true'
        env:
          PHP_MINOR: ${{ matrix.php }}
          DISTRO: ${{ matrix.distro }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          ARCH: ${{ matrix.arch }}
          OXPHP_VER: ${{ matrix.oxphp }}
          BASE_DIGEST: ${{ steps.base_digest.outputs.digest }}
        run: |
          docker buildx build \
            --platform "linux/${ARCH}" \
            --file "$DOCKERFILE" \
            --build-arg "PHP_VERSION=${PHP_MINOR}" \
            --build-arg "BASE_IMAGE=php:${PHP_MINOR}-zts-${DISTRO}" \
            --build-arg "OXPHP_VERSION=${OXPHP_VER}" \
            --cache-from "type=gha,scope=weekly-${ARCH}-${PHP_MINOR}-${BASE_DIGEST}" \
            --cache-to "type=gha,scope=weekly-${ARCH}-${PHP_MINOR}-${BASE_DIGEST},mode=max" \
            --annotation "manifest:org.oxphp.upstream-digest=${BASE_DIGEST}" \
            --load \
            -t oxphp:ci \
            .

      - name: Smoke test
        if: steps.decide.outputs.skip != 'true'
        env:
          EXPECTED_PHP: ${{ steps.php_patch.outputs.patch }}
        run: |
          ./scripts/smoke-test-image.sh oxphp:ci "$EXPECTED_PHP"

      - name: Push arch-specific minor-floating tag
        if: steps.decide.outputs.skip != 'true'
        env:
          OXPHP_VER: ${{ matrix.oxphp }}
          PHP_MINOR: ${{ matrix.php }}
          DISTRO: ${{ matrix.distro }}
          ARCH: ${{ matrix.arch }}
        run: |
          TAG="${REGISTRY}/${IMAGE_NAME}:${OXPHP_VER}-php${PHP_MINOR}-${DISTRO}-${ARCH}"
          docker tag oxphp:ci "$TAG"
          docker push "$TAG"

      - name: Push arch-specific patch-pinned tag
        if: steps.decide.outputs.skip != 'true'
        env:
          OXPHP_VER: ${{ matrix.oxphp }}
          PHP_PATCH: ${{ steps.php_patch.outputs.patch }}
          DISTRO: ${{ matrix.distro }}
          ARCH: ${{ matrix.arch }}
        run: |
          TAG="${REGISTRY}/${IMAGE_NAME}:${OXPHP_VER}-php${PHP_PATCH}-${DISTRO}-${ARCH}"
          docker tag oxphp:ci "$TAG"
          docker push "$TAG"

      - name: Record PHP patch for downstream jobs
        if: steps.decide.outputs.skip != 'true'
        env:
          PHP_PATCH: ${{ steps.php_patch.outputs.patch }}
          OXPHP_VER: ${{ matrix.oxphp }}
          PHP_MINOR: ${{ matrix.php }}
          DISTRO: ${{ matrix.distro }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p /tmp/outputs
          echo "$PHP_PATCH" > "/tmp/outputs/php_patch_${OXPHP_VER}_${PHP_MINOR}_${DISTRO}_${ARCH}.txt"

      - name: Upload PHP patch artifact
        if: steps.decide.outputs.skip != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: php-patch-${{ matrix.oxphp }}-${{ matrix.php }}-${{ matrix.distro }}-${{ matrix.arch }}
          path: /tmp/outputs/php_patch_${{ matrix.oxphp }}_${{ matrix.php }}_${{ matrix.distro }}_${{ matrix.arch }}.txt
          retention-days: 1

  # ──────────────────────────────────────────────────────────────
  # Job 2.5: subset PHP integration suite — only when build wasn't skipped
  # ──────────────────────────────────────────────────────────────
  # Same focused 6-suite scope as release.yml::php-suite — covers SAPI-class
  # regressions from upstream PHP patches without doubling weekly cost. The
  # `if: needs.build.result == 'success'` clause is a coarse proxy for
  # "actually built something" — when every cell in `build` short-circuits
  # via the digest check, GitHub still reports `result: success` because no
  # cell failed, so the suite runs against the previously-published image.
  # Acceptable false-positive: one extra ~5-min subset run per weekly cycle
  # when nothing actually changed.
  # ──────────────────────────────────────────────────────────────
  php-suite-subset:
    needs: [plan, build]
    if: ${{ needs.build.result == 'success' }}
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJson(needs.plan.outputs.suite_matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v${{ matrix.oxphp }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull just-built amd64 image and tag as oxphp:dev
        env:
          OXPHP_VER: ${{ matrix.oxphp }}
          PHP_MINOR: ${{ matrix.php }}
          DISTRO: ${{ matrix.distro }}
        run: |
          SRC="${REGISTRY}/${IMAGE_NAME}:${OXPHP_VER}-php${PHP_MINOR}-${DISTRO}-amd64"
          docker pull "$SRC"
          docker tag "$SRC" oxphp:dev

      - name: Run focused PHP integration suites
        env:
          PHP_VERSION: ${{ matrix.php }}
        run: |
          set -eo pipefail
          # Suites run against a fresh build of the released source checked out
          # above. The list may name suites that only exist in newer versions;
          # any suite file absent from an older released tag is skipped so this
          # job stays green across every supported version.
          SUITES=(
            headers
            cookies
            get_post_request
            input
            pathinfo
            errors
            async
            async1
            asynccap
            asyncob
          )
          FAILED=()
          for suite in "${SUITES[@]}"; do
            if [ ! -f "tests/suites/${suite}.txt" ]; then
              echo "::notice::Suite ${suite} not present in this release — skipping"
              continue
            fi
            echo "::group::Suite: $suite"
            if ! ./tests/run_all.sh --no-build --suite="$suite"; then
              FAILED+=("$suite")
            fi
            echo "::endgroup::"
          done
          if [[ ${#FAILED[@]} -gt 0 ]]; then
            echo "FAILED suites: ${FAILED[*]}" >&2
            exit 1
          fi

  # ──────────────────────────────────────────────────────────────
  # Job 3: per-(oxphp, PHP, distro) manifest merge + sign + aliases
  # ──────────────────────────────────────────────────────────────
  manifest:
    needs: [plan, build, php-suite-subset]
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.merge_matrix) }}
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download PHP patch artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: php-patch-${{ matrix.oxphp }}-${{ matrix.php }}-${{ matrix.distro }}-*
          path: /tmp/patches

      - name: Verify PHP patch consistency across arches
        id: patch
        env:
          OXPHP_VER: ${{ matrix.oxphp }}
          PHP_MINOR: ${{ matrix.php }}
          DISTRO: ${{ matrix.distro }}
        run: |
          AMD_FILE="/tmp/patches/php-patch-${OXPHP_VER}-${PHP_MINOR}-${DISTRO}-amd64/php_patch_${OXPHP_VER}_${PHP_MINOR}_${DISTRO}_amd64.txt"
          ARM_FILE="/tmp/patches/php-patch-${OXPHP_VER}-${PHP_MINOR}-${DISTRO}-arm64/php_patch_${OXPHP_VER}_${PHP_MINOR}_${DISTRO}_arm64.txt"
          AMD=$(cat "$AMD_FILE")
          ARM=$(cat "$ARM_FILE")
          if [[ "$AMD" != "$ARM" ]]; then
            echo "error: PHP patch mismatch. amd64=$AMD arm64=$ARM" >&2
            exit 1
          fi
          echo "patch=$AMD" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create minor-floating multi-arch manifest
        env:
          OXPHP_VER: ${{ matrix.oxphp }}
          PHP_MINOR: ${{ matrix.php }}
          DISTRO: ${{ matrix.distro }}
        run: |
          docker buildx imagetools create \
            -t "${REGISTRY}/${IMAGE_NAME}:${OXPHP_VER}-php${PHP_MINOR}-${DISTRO}" \
            "${REGISTRY}/${IMAGE_NAME}:${OXPHP_VER}-php${PHP_MINOR}-${DISTRO}-amd64" \
            "${REGISTRY}/${IMAGE_NAME}:${OXPHP_VER}-php${PHP_MINOR}-${DISTRO}-arm64"

      - name: Create patch-pinned multi-arch manifest
        env:
          OXPHP_VER: ${{ matrix.oxphp }}
          PHP_MINOR: ${{ matrix.php }}
          PHP_PATCH: ${{ steps.patch.outputs.patch }}
          DISTRO: ${{ matrix.distro }}
        run: |
          docker buildx imagetools create \
            -t "${REGISTRY}/${IMAGE_NAME}:${OXPHP_VER}-php${PHP_PATCH}-${DISTRO}" \
            "${REGISTRY}/${IMAGE_NAME}:${OXPHP_VER}-php${PHP_MINOR}-${DISTRO}-amd64" \
            "${REGISTRY}/${IMAGE_NAME}:${OXPHP_VER}-php${PHP_MINOR}-${DISTRO}-arm64"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign canonical tags
        env:
          OXPHP_VER: ${{ matrix.oxphp }}
          PHP_MINOR: ${{ matrix.php }}
          PHP_PATCH: ${{ steps.patch.outputs.patch }}
          DISTRO: ${{ matrix.distro }}
        run: |
          cosign sign --yes "${REGISTRY}/${IMAGE_NAME}:${OXPHP_VER}-php${PHP_MINOR}-${DISTRO}"
          cosign sign --yes "${REGISTRY}/${IMAGE_NAME}:${OXPHP_VER}-php${PHP_PATCH}-${DISTRO}"

      - name: Install yq
        run: |
          sudo curl -sL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Move aliases
        env:
          OXPHP_VER: ${{ matrix.oxphp }}
          PHP_MINOR: ${{ matrix.php }}
          DISTRO: ${{ matrix.distro }}
          REGISTRY_OVERRIDE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          REGISTRY="$REGISTRY_OVERRIDE" ./scripts/move-aliases.sh \
            "$OXPHP_VER" \
            "$PHP_MINOR" \
            "$DISTRO"

      - name: Sign moved aliases
        env:
          OXPHP_VER: ${{ matrix.oxphp }}
          PHP_MINOR: ${{ matrix.php }}
          DISTRO: ${{ matrix.distro }}
          REGISTRY_OVERRIDE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          ALIASES=$(REGISTRY="$REGISTRY_OVERRIDE" ./scripts/move-aliases.sh \
            "$OXPHP_VER" "$PHP_MINOR" "$DISTRO" --list)
          for ALIAS in $ALIASES; do
            cosign sign --yes "$ALIAS"
          done
