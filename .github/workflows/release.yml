name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: oxphp/oxphp

permissions:
  contents: read
  packages: write
  id-token: write  # required for cosign keyless signing via GitHub OIDC

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: per-(PHP, distribution, arch) build + push arch-specific tags.
  # The distribution is both the PHP base image's tag suffix
  # (php:8.4-zts-alpine3.23, php:8.4-zts-trixie) and the image tag's.
  # ──────────────────────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
        arch: [amd64, arm64]
        distro: [alpine3.23, trixie]
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
          - { distro: alpine3.23, dockerfile: docker/release/alpine/Dockerfile }
          - { distro: trixie, dockerfile: docker/release/debian/Dockerfile }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract oxphp version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Resolve upstream base image digest
        id: base_digest
        env:
          PHP_MINOR: ${{ matrix.php }}
          DISTRO: ${{ matrix.distro }}
        run: |
          BASE="php:${PHP_MINOR}-zts-${DISTRO}"
          # `--format '{{.Manifest.Digest}}'` is silently ignored in newer
          # docker buildx builds and returns the full human-readable
          # output instead, which would produce multi-line $GITHUB_OUTPUT
          # and fail the workflow step with "Invalid format 'MediaType:
          # application/vnd.oci.image.index.v1+json'". Parse the default
          # output with awk instead — the Digest: line at the top of the
          # output is the manifest-list (OCI index) digest, which is
          # what we want for the cache-key input.
          DIGEST=$(docker buildx imagetools inspect "$BASE" 2>/dev/null | awk '/^Digest:/{print $2; exit}')
          if [[ -z "$DIGEST" ]]; then
            echo "error: could not resolve digest for $BASE" >&2
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Resolve PHP patch version from base image
        id: php_patch
        env:
          PHP_MINOR: ${{ matrix.php }}
          DISTRO: ${{ matrix.distro }}
          ARCH: ${{ matrix.arch }}
        run: |
          BASE="php:${PHP_MINOR}-zts-${DISTRO}"
          docker pull --platform "linux/${ARCH}" "$BASE"
          PATCH=$(docker run --rm --platform "linux/${ARCH}" "$BASE" php -r 'echo PHP_VERSION;')
          if [[ ! "$PATCH" =~ ^${PHP_MINOR}\.[0-9]+$ ]]; then
            echo "error: unexpected PHP version from base image: $PATCH (expected ${PHP_MINOR}.x)" >&2
            exit 1
          fi
          echo "patch=$PATCH" >> "$GITHUB_OUTPUT"
          echo "Resolved PHP patch: $PATCH"

      - name: Build image from ${{ matrix.dockerfile }}
        env:
          PHP_MINOR: ${{ matrix.php }}
          DISTRO: ${{ matrix.distro }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx build \
            --platform "linux/${ARCH}" \
            --file "$DOCKERFILE" \
            --build-arg "PHP_VERSION=${PHP_MINOR}" \
            --build-arg "BASE_IMAGE=php:${PHP_MINOR}-zts-${DISTRO}" \
            --build-arg "OXPHP_VERSION=${VERSION}" \
            --cache-from "type=gha,scope=release-${ARCH}-${PHP_MINOR}-${DISTRO}" \
            --cache-to "type=gha,scope=release-${ARCH}-${PHP_MINOR}-${DISTRO},mode=max" \
            --load \
            -t oxphp:ci \
            .

      - name: Smoke test
        env:
          EXPECTED_PHP: ${{ steps.php_patch.outputs.patch }}
        run: |
          ./scripts/smoke-test-image.sh oxphp:ci "$EXPECTED_PHP"

      - name: Push arch-specific minor-floating tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PHP_MINOR: ${{ matrix.php }}
          DISTRO: ${{ matrix.distro }}
          ARCH: ${{ matrix.arch }}
        run: |
          TAG="${REGISTRY}/${IMAGE_NAME}:${VERSION}-php${PHP_MINOR}-${DISTRO}-${ARCH}"
          docker tag oxphp:ci "$TAG"
          docker push "$TAG"

      - name: Push arch-specific patch-pinned tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PHP_PATCH: ${{ steps.php_patch.outputs.patch }}
          DISTRO: ${{ matrix.distro }}
          ARCH: ${{ matrix.arch }}
        run: |
          TAG="${REGISTRY}/${IMAGE_NAME}:${VERSION}-php${PHP_PATCH}-${DISTRO}-${ARCH}"
          docker tag oxphp:ci "$TAG"
          docker push "$TAG"

      - name: Record PHP patch for manifest-merge step
        env:
          PHP_PATCH: ${{ steps.php_patch.outputs.patch }}
          PHP_MINOR: ${{ matrix.php }}
          DISTRO: ${{ matrix.distro }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p /tmp/outputs
          echo "$PHP_PATCH" > "/tmp/outputs/php_patch_${PHP_MINOR}_${DISTRO}_${ARCH}.txt"

      - name: Upload PHP patch artifact
        uses: actions/upload-artifact@v6
        with:
          name: php-patch-${{ matrix.php }}-${{ matrix.distro }}-${{ matrix.arch }}
          path: /tmp/outputs/php_patch_${{ matrix.php }}_${{ matrix.distro }}_${{ matrix.arch }}.txt
          retention-days: 1

  # ──────────────────────────────────────────────────────────────
  # Job 2: per-(PHP, distribution) manifest-list creation, cosign signing
  # of the canonical tags, then the aliases moved onto them and signed.
  # One matrix cell per pair, so a manifest failure of one pair does not
  # block the others' publication.
  # ──────────────────────────────────────────────────────────────
  publish:
    needs: build
    if: always() && needs.build.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
        distro: [alpine3.23, trixie]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract oxphp version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download PHP patch artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: php-patch-${{ matrix.php }}-${{ matrix.distro }}-*
          path: /tmp/patches

      - name: Verify PHP patch consistency across arches
        id: patch
        env:
          PHP_MINOR: ${{ matrix.php }}
          DISTRO: ${{ matrix.distro }}
        run: |
          AMD=$(cat "/tmp/patches/php-patch-${PHP_MINOR}-${DISTRO}-amd64/php_patch_${PHP_MINOR}_${DISTRO}_amd64.txt")
          ARM=$(cat "/tmp/patches/php-patch-${PHP_MINOR}-${DISTRO}-arm64/php_patch_${PHP_MINOR}_${DISTRO}_arm64.txt")
          if [[ "$AMD" != "$ARM" ]]; then
            echo "error: PHP patch mismatch across arches. amd64=$AMD arm64=$ARM" >&2
            exit 1
          fi
          echo "patch=$AMD" >> "$GITHUB_OUTPUT"

      - name: Create minor-floating multi-arch manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PHP_MINOR: ${{ matrix.php }}
          DISTRO: ${{ matrix.distro }}
        run: |
          docker buildx imagetools create \
            -t "${REGISTRY}/${IMAGE_NAME}:${VERSION}-php${PHP_MINOR}-${DISTRO}" \
            "${REGISTRY}/${IMAGE_NAME}:${VERSION}-php${PHP_MINOR}-${DISTRO}-amd64" \
            "${REGISTRY}/${IMAGE_NAME}:${VERSION}-php${PHP_MINOR}-${DISTRO}-arm64"

      - name: Create patch-pinned multi-arch manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PHP_MINOR: ${{ matrix.php }}
          PHP_PATCH: ${{ steps.patch.outputs.patch }}
          DISTRO: ${{ matrix.distro }}
        run: |
          docker buildx imagetools create \
            -t "${REGISTRY}/${IMAGE_NAME}:${VERSION}-php${PHP_PATCH}-${DISTRO}" \
            "${REGISTRY}/${IMAGE_NAME}:${VERSION}-php${PHP_MINOR}-${DISTRO}-amd64" \
            "${REGISTRY}/${IMAGE_NAME}:${VERSION}-php${PHP_MINOR}-${DISTRO}-arm64"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign canonical tags
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PHP_MINOR: ${{ matrix.php }}
          PHP_PATCH: ${{ steps.patch.outputs.patch }}
          DISTRO: ${{ matrix.distro }}
        run: |
          for TAG in \
            "${REGISTRY}/${IMAGE_NAME}:${VERSION}-php${PHP_MINOR}-${DISTRO}" \
            "${REGISTRY}/${IMAGE_NAME}:${VERSION}-php${PHP_PATCH}-${DISTRO}"; do
            echo "Signing $TAG"
            cosign sign --yes "$TAG"
          done

      - name: Install yq
        run: |
          sudo curl -sL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Move aliases
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PHP_MINOR: ${{ matrix.php }}
          DISTRO: ${{ matrix.distro }}
          REGISTRY_OVERRIDE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          REGISTRY="$REGISTRY_OVERRIDE" ./scripts/move-aliases.sh \
            "$VERSION" \
            "$PHP_MINOR" \
            "$DISTRO"

      - name: Sign moved aliases (they now resolve to canonical digests)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PHP_MINOR: ${{ matrix.php }}
          DISTRO: ${{ matrix.distro }}
          REGISTRY_OVERRIDE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          ALIASES=$(REGISTRY="$REGISTRY_OVERRIDE" ./scripts/move-aliases.sh \
            "$VERSION" "$PHP_MINOR" "$DISTRO" --list)
          for ALIAS in $ALIASES; do
            cosign sign --yes "$ALIAS"
          done
