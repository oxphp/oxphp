name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: oxphp/oxphp
  DOCKERHUB_REGISTRY: docker.io
  DOCKERHUB_IMAGE_NAME: oxphp/oxphp

permissions:
  contents: read
  packages: write
  id-token: write  # required for cosign keyless signing via GitHub OIDC

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: per-(PHP, Alpine, arch) build + push arch-specific tags
  # ──────────────────────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: "8.4", alpine: "3.23", arch: "amd64", runner: "ubuntu-latest" }
          - { php: "8.4", alpine: "3.23", arch: "arm64", runner: "ubuntu-24.04-arm" }
          - { php: "8.5", alpine: "3.23", arch: "amd64", runner: "ubuntu-latest" }
          - { php: "8.5", alpine: "3.23", arch: "arm64", runner: "ubuntu-24.04-arm" }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract oxphp version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Resolve upstream base image digest
        id: base_digest
        env:
          PHP_MINOR: ${{ matrix.php }}
          ALPINE_VER: ${{ matrix.alpine }}
        run: |
          BASE="php:${PHP_MINOR}-zts-alpine${ALPINE_VER}"
          # `--format '{{.Manifest.Digest}}'` is silently ignored in newer
          # docker buildx builds and returns the full human-readable
          # output instead, which would produce multi-line $GITHUB_OUTPUT
          # and fail the workflow step with "Invalid format 'MediaType:
          # application/vnd.oci.image.index.v1+json'". Parse the default
          # output with awk instead — the Digest: line at the top of the
          # output is the manifest-list (OCI index) digest, which is
          # what we want for the cache-key input.
          DIGEST=$(docker buildx imagetools inspect "$BASE" 2>/dev/null | awk '/^Digest:/{print $2; exit}')
          if [[ -z "$DIGEST" ]]; then
            echo "error: could not resolve digest for $BASE" >&2
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Resolve PHP patch version from base image
        id: php_patch
        env:
          PHP_MINOR: ${{ matrix.php }}
          ALPINE_VER: ${{ matrix.alpine }}
          ARCH: ${{ matrix.arch }}
        run: |
          BASE="php:${PHP_MINOR}-zts-alpine${ALPINE_VER}"
          docker pull --platform "linux/${ARCH}" "$BASE"
          PATCH=$(docker run --rm --platform "linux/${ARCH}" "$BASE" php -r 'echo PHP_VERSION;')
          if [[ ! "$PATCH" =~ ^${PHP_MINOR}\.[0-9]+$ ]]; then
            echo "error: unexpected PHP version from base image: $PATCH (expected ${PHP_MINOR}.x)" >&2
            exit 1
          fi
          echo "patch=$PATCH" >> "$GITHUB_OUTPUT"
          echo "Resolved PHP patch: $PATCH"

      - name: Build image from docker/release/alpine/Dockerfile
        env:
          PHP_MINOR: ${{ matrix.php }}
          ALPINE_VER: ${{ matrix.alpine }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx build \
            --platform "linux/${ARCH}" \
            --file docker/release/alpine/Dockerfile \
            --build-arg "PHP_VERSION=${PHP_MINOR}" \
            --build-arg "ALPINE_VERSION=${ALPINE_VER}" \
            --build-arg "OXPHP_VERSION=${VERSION}" \
            --cache-from "type=gha,scope=release-${ARCH}-${PHP_MINOR}" \
            --cache-to "type=gha,scope=release-${ARCH}-${PHP_MINOR},mode=max" \
            --load \
            -t oxphp:ci \
            .

      - name: Smoke test
        env:
          EXPECTED_PHP: ${{ steps.php_patch.outputs.patch }}
        run: |
          ./scripts/smoke-test-image.sh oxphp:ci "$EXPECTED_PHP"

      - name: Push arch-specific minor-floating tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PHP_MINOR: ${{ matrix.php }}
          ALPINE_VER: ${{ matrix.alpine }}
          ARCH: ${{ matrix.arch }}
        run: |
          for PREFIX in "${REGISTRY}/${IMAGE_NAME}" "${DOCKERHUB_REGISTRY}/${DOCKERHUB_IMAGE_NAME}"; do
            TAG="${PREFIX}:${VERSION}-php${PHP_MINOR}-alpine${ALPINE_VER}-${ARCH}"
            docker tag oxphp:ci "$TAG"
            docker push "$TAG"
          done

      - name: Push arch-specific patch-pinned tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PHP_PATCH: ${{ steps.php_patch.outputs.patch }}
          ALPINE_VER: ${{ matrix.alpine }}
          ARCH: ${{ matrix.arch }}
        run: |
          for PREFIX in "${REGISTRY}/${IMAGE_NAME}" "${DOCKERHUB_REGISTRY}/${DOCKERHUB_IMAGE_NAME}"; do
            TAG="${PREFIX}:${VERSION}-php${PHP_PATCH}-alpine${ALPINE_VER}-${ARCH}"
            docker tag oxphp:ci "$TAG"
            docker push "$TAG"
          done

      - name: Record PHP patch for manifest-merge step
        env:
          PHP_PATCH: ${{ steps.php_patch.outputs.patch }}
          PHP_MINOR: ${{ matrix.php }}
          ALPINE_VER: ${{ matrix.alpine }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p /tmp/outputs
          echo "$PHP_PATCH" > "/tmp/outputs/php_patch_${PHP_MINOR}_${ALPINE_VER}_${ARCH}.txt"

      - name: Upload PHP patch artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-patch-${{ matrix.php }}-${{ matrix.alpine }}-${{ matrix.arch }}
          path: /tmp/outputs/php_patch_${{ matrix.php }}_${{ matrix.alpine }}_${{ matrix.arch }}.txt
          retention-days: 1

  # ──────────────────────────────────────────────────────────────
  # Job 2: per-(PHP, Alpine) manifest-list creation
  # Per-version jobs so an 8.5 manifest failure (or skipped chain due to
  # build failure) does not block 8.4 manifest publication.
  # ──────────────────────────────────────────────────────────────
  manifest-84:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    env:
      PHP_MINOR: "8.4"
      ALPINE_VER: "3.23"
    outputs:
      canonical_minor: ${{ steps.canonicals.outputs.minor }}
      canonical_patch: ${{ steps.canonicals.outputs.patch }}
      canonical_minor_dh: ${{ steps.canonicals.outputs.minor_dh }}
      canonical_patch_dh: ${{ steps.canonicals.outputs.patch_dh }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract oxphp version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download PHP patch artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: php-patch-${{ env.PHP_MINOR }}-${{ env.ALPINE_VER }}-*
          path: /tmp/patches

      - name: Verify PHP patch consistency across arches
        id: patch
        run: |
          AMD=$(cat "/tmp/patches/php-patch-${PHP_MINOR}-${ALPINE_VER}-amd64/php_patch_${PHP_MINOR}_${ALPINE_VER}_amd64.txt")
          ARM=$(cat "/tmp/patches/php-patch-${PHP_MINOR}-${ALPINE_VER}-arm64/php_patch_${PHP_MINOR}_${ALPINE_VER}_arm64.txt")
          if [[ "$AMD" != "$ARM" ]]; then
            echo "error: PHP patch mismatch across arches. amd64=$AMD arm64=$ARM" >&2
            exit 1
          fi
          echo "patch=$AMD" >> "$GITHUB_OUTPUT"

      - name: Create minor-floating multi-arch manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for PREFIX in "${REGISTRY}/${IMAGE_NAME}" "${DOCKERHUB_REGISTRY}/${DOCKERHUB_IMAGE_NAME}"; do
            docker buildx imagetools create \
              -t "${PREFIX}:${VERSION}-php${PHP_MINOR}-alpine${ALPINE_VER}" \
              "${PREFIX}:${VERSION}-php${PHP_MINOR}-alpine${ALPINE_VER}-amd64" \
              "${PREFIX}:${VERSION}-php${PHP_MINOR}-alpine${ALPINE_VER}-arm64"
          done

      - name: Create patch-pinned multi-arch manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PHP_PATCH: ${{ steps.patch.outputs.patch }}
        run: |
          for PREFIX in "${REGISTRY}/${IMAGE_NAME}" "${DOCKERHUB_REGISTRY}/${DOCKERHUB_IMAGE_NAME}"; do
            docker buildx imagetools create \
              -t "${PREFIX}:${VERSION}-php${PHP_PATCH}-alpine${ALPINE_VER}" \
              "${PREFIX}:${VERSION}-php${PHP_MINOR}-alpine${ALPINE_VER}-amd64" \
              "${PREFIX}:${VERSION}-php${PHP_MINOR}-alpine${ALPINE_VER}-arm64"
          done

      - name: Export canonical tag names
        id: canonicals
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PHP_PATCH: ${{ steps.patch.outputs.patch }}
        run: |
          echo "minor=${REGISTRY}/${IMAGE_NAME}:${VERSION}-php${PHP_MINOR}-alpine${ALPINE_VER}" >> "$GITHUB_OUTPUT"
          echo "patch=${REGISTRY}/${IMAGE_NAME}:${VERSION}-php${PHP_PATCH}-alpine${ALPINE_VER}" >> "$GITHUB_OUTPUT"
          echo "minor_dh=${DOCKERHUB_REGISTRY}/${DOCKERHUB_IMAGE_NAME}:${VERSION}-php${PHP_MINOR}-alpine${ALPINE_VER}" >> "$GITHUB_OUTPUT"
          echo "patch_dh=${DOCKERHUB_REGISTRY}/${DOCKERHUB_IMAGE_NAME}:${VERSION}-php${PHP_PATCH}-alpine${ALPINE_VER}" >> "$GITHUB_OUTPUT"

  manifest-85:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    env:
      PHP_MINOR: "8.5"
      ALPINE_VER: "3.23"
    outputs:
      canonical_minor: ${{ steps.canonicals.outputs.minor }}
      canonical_patch: ${{ steps.canonicals.outputs.patch }}
      canonical_minor_dh: ${{ steps.canonicals.outputs.minor_dh }}
      canonical_patch_dh: ${{ steps.canonicals.outputs.patch_dh }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract oxphp version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download PHP patch artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: php-patch-${{ env.PHP_MINOR }}-${{ env.ALPINE_VER }}-*
          path: /tmp/patches

      - name: Verify PHP patch consistency across arches
        id: patch
        run: |
          AMD=$(cat "/tmp/patches/php-patch-${PHP_MINOR}-${ALPINE_VER}-amd64/php_patch_${PHP_MINOR}_${ALPINE_VER}_amd64.txt")
          ARM=$(cat "/tmp/patches/php-patch-${PHP_MINOR}-${ALPINE_VER}-arm64/php_patch_${PHP_MINOR}_${ALPINE_VER}_arm64.txt")
          if [[ "$AMD" != "$ARM" ]]; then
            echo "error: PHP patch mismatch across arches. amd64=$AMD arm64=$ARM" >&2
            exit 1
          fi
          echo "patch=$AMD" >> "$GITHUB_OUTPUT"

      - name: Create minor-floating multi-arch manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for PREFIX in "${REGISTRY}/${IMAGE_NAME}" "${DOCKERHUB_REGISTRY}/${DOCKERHUB_IMAGE_NAME}"; do
            docker buildx imagetools create \
              -t "${PREFIX}:${VERSION}-php${PHP_MINOR}-alpine${ALPINE_VER}" \
              "${PREFIX}:${VERSION}-php${PHP_MINOR}-alpine${ALPINE_VER}-amd64" \
              "${PREFIX}:${VERSION}-php${PHP_MINOR}-alpine${ALPINE_VER}-arm64"
          done

      - name: Create patch-pinned multi-arch manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PHP_PATCH: ${{ steps.patch.outputs.patch }}
        run: |
          for PREFIX in "${REGISTRY}/${IMAGE_NAME}" "${DOCKERHUB_REGISTRY}/${DOCKERHUB_IMAGE_NAME}"; do
            docker buildx imagetools create \
              -t "${PREFIX}:${VERSION}-php${PHP_PATCH}-alpine${ALPINE_VER}" \
              "${PREFIX}:${VERSION}-php${PHP_MINOR}-alpine${ALPINE_VER}-amd64" \
              "${PREFIX}:${VERSION}-php${PHP_MINOR}-alpine${ALPINE_VER}-arm64"
          done

      - name: Export canonical tag names
        id: canonicals
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PHP_PATCH: ${{ steps.patch.outputs.patch }}
        run: |
          echo "minor=${REGISTRY}/${IMAGE_NAME}:${VERSION}-php${PHP_MINOR}-alpine${ALPINE_VER}" >> "$GITHUB_OUTPUT"
          echo "patch=${REGISTRY}/${IMAGE_NAME}:${VERSION}-php${PHP_PATCH}-alpine${ALPINE_VER}" >> "$GITHUB_OUTPUT"
          echo "minor_dh=${DOCKERHUB_REGISTRY}/${DOCKERHUB_IMAGE_NAME}:${VERSION}-php${PHP_MINOR}-alpine${ALPINE_VER}" >> "$GITHUB_OUTPUT"
          echo "patch_dh=${DOCKERHUB_REGISTRY}/${DOCKERHUB_IMAGE_NAME}:${VERSION}-php${PHP_PATCH}-alpine${ALPINE_VER}" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────────────────
  # Job 3: cosign signing of canonical tags (per-version)
  # ──────────────────────────────────────────────────────────────
  sign-84:
    needs: manifest-84
    if: always() && needs.manifest-84.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign canonical tags
        env:
          CANONICAL_MINOR: ${{ needs.manifest-84.outputs.canonical_minor }}
          CANONICAL_PATCH: ${{ needs.manifest-84.outputs.canonical_patch }}
          CANONICAL_MINOR_DH: ${{ needs.manifest-84.outputs.canonical_minor_dh }}
          CANONICAL_PATCH_DH: ${{ needs.manifest-84.outputs.canonical_patch_dh }}
        run: |
          for TAG in "$CANONICAL_MINOR" "$CANONICAL_PATCH" "$CANONICAL_MINOR_DH" "$CANONICAL_PATCH_DH"; do
            echo "Signing $TAG"
            cosign sign --yes "$TAG"
          done

  sign-85:
    needs: manifest-85
    if: always() && needs.manifest-85.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign canonical tags
        env:
          CANONICAL_MINOR: ${{ needs.manifest-85.outputs.canonical_minor }}
          CANONICAL_PATCH: ${{ needs.manifest-85.outputs.canonical_patch }}
          CANONICAL_MINOR_DH: ${{ needs.manifest-85.outputs.canonical_minor_dh }}
          CANONICAL_PATCH_DH: ${{ needs.manifest-85.outputs.canonical_patch_dh }}
        run: |
          for TAG in "$CANONICAL_MINOR" "$CANONICAL_PATCH" "$CANONICAL_MINOR_DH" "$CANONICAL_PATCH_DH"; do
            echo "Signing $TAG"
            cosign sign --yes "$TAG"
          done

  # ──────────────────────────────────────────────────────────────
  # Job 4: move aliases to newly-published canonicals (per-version)
  # ──────────────────────────────────────────────────────────────
  aliases-84:
    needs: sign-84
    if: always() && needs.sign-84.result == 'success'
    runs-on: ubuntu-latest
    env:
      PHP_MINOR: "8.4"
      ALPINE_VER: "3.23"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install yq
        run: |
          sudo curl -sL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Extract oxphp version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Move aliases (ghcr + Docker Hub)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GHCR_PREFIX: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DH_PREFIX: ${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_IMAGE_NAME }}
        run: |
          for PREFIX in "$GHCR_PREFIX" "$DH_PREFIX"; do
            REGISTRY="$PREFIX" ./scripts/move-aliases.sh \
              "$VERSION" \
              "$PHP_MINOR" \
              "$ALPINE_VER"
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign moved aliases (they now resolve to canonical digests)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SEMVER_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
          LATEST_OXPHP=$(yq '.oxphp_versions[0]' .github/supported-versions.yml)
          DEFAULT_PHP=$(yq '.default_php' .github/supported-versions.yml)

          for PREFIX in "${REGISTRY}/${IMAGE_NAME}" "${DOCKERHUB_REGISTRY}/${DOCKERHUB_IMAGE_NAME}"; do
            cosign sign --yes "${PREFIX}:${VERSION}-php${PHP_MINOR}"
            cosign sign --yes "${PREFIX}:${SEMVER_MINOR}-php${PHP_MINOR}"

            if [[ "$VERSION" == "$LATEST_OXPHP" ]]; then
              cosign sign --yes "${PREFIX}:php${PHP_MINOR}"
              if [[ "$PHP_MINOR" == "$DEFAULT_PHP" ]]; then
                cosign sign --yes "${PREFIX}:${VERSION}"
                cosign sign --yes "${PREFIX}:latest"
              fi
            fi
          done

  aliases-85:
    needs: sign-85
    if: always() && needs.sign-85.result == 'success'
    runs-on: ubuntu-latest
    env:
      PHP_MINOR: "8.5"
      ALPINE_VER: "3.23"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install yq
        run: |
          sudo curl -sL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Extract oxphp version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Move aliases (ghcr + Docker Hub)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GHCR_PREFIX: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DH_PREFIX: ${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_IMAGE_NAME }}
        run: |
          for PREFIX in "$GHCR_PREFIX" "$DH_PREFIX"; do
            REGISTRY="$PREFIX" ./scripts/move-aliases.sh \
              "$VERSION" \
              "$PHP_MINOR" \
              "$ALPINE_VER"
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign moved aliases (they now resolve to canonical digests)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SEMVER_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
          LATEST_OXPHP=$(yq '.oxphp_versions[0]' .github/supported-versions.yml)
          DEFAULT_PHP=$(yq '.default_php' .github/supported-versions.yml)

          for PREFIX in "${REGISTRY}/${IMAGE_NAME}" "${DOCKERHUB_REGISTRY}/${DOCKERHUB_IMAGE_NAME}"; do
            cosign sign --yes "${PREFIX}:${VERSION}-php${PHP_MINOR}"
            cosign sign --yes "${PREFIX}:${SEMVER_MINOR}-php${PHP_MINOR}"

            if [[ "$VERSION" == "$LATEST_OXPHP" ]]; then
              cosign sign --yes "${PREFIX}:php${PHP_MINOR}"
              if [[ "$PHP_MINOR" == "$DEFAULT_PHP" ]]; then
                cosign sign --yes "${PREFIX}:${VERSION}"
                cosign sign --yes "${PREFIX}:latest"
              fi
            fi
          done
