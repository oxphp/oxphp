name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: oxphp/oxphp

permissions:
  contents: read
  packages: write
  id-token: write  # required for cosign keyless signing via GitHub OIDC

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: per-(PHP, Alpine, arch) build + push arch-specific tags
  # ──────────────────────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: "8.4", alpine: "3.23", arch: "amd64", runner: "ubuntu-latest" }
          - { php: "8.4", alpine: "3.23", arch: "arm64", runner: "ubuntu-24.04-arm" }
          - { php: "8.5", alpine: "3.23", arch: "amd64", runner: "ubuntu-latest" }
          - { php: "8.5", alpine: "3.23", arch: "arm64", runner: "ubuntu-24.04-arm" }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract oxphp version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Resolve upstream base image digest
        id: base_digest
        env:
          PHP_MINOR: ${{ matrix.php }}
          ALPINE_VER: ${{ matrix.alpine }}
        run: |
          BASE="php:${PHP_MINOR}-zts-alpine${ALPINE_VER}"
          # `--format '{{.Manifest.Digest}}'` is silently ignored in newer
          # docker buildx builds and returns the full human-readable
          # output instead, which would produce multi-line $GITHUB_OUTPUT
          # and fail the workflow step with "Invalid format 'MediaType:
          # application/vnd.oci.image.index.v1+json'". Parse the default
          # output with awk instead — the Digest: line at the top of the
          # output is the manifest-list (OCI index) digest, which is
          # what we want for the cache-key input.
          DIGEST=$(docker buildx imagetools inspect "$BASE" 2>/dev/null | awk '/^Digest:/{print $2; exit}')
          if [[ -z "$DIGEST" ]]; then
            echo "error: could not resolve digest for $BASE" >&2
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Resolve PHP patch version from base image
        id: php_patch
        env:
          PHP_MINOR: ${{ matrix.php }}
          ALPINE_VER: ${{ matrix.alpine }}
          ARCH: ${{ matrix.arch }}
        run: |
          BASE="php:${PHP_MINOR}-zts-alpine${ALPINE_VER}"
          docker pull --platform "linux/${ARCH}" "$BASE"
          PATCH=$(docker run --rm --platform "linux/${ARCH}" "$BASE" php -r 'echo PHP_VERSION;')
          if [[ ! "$PATCH" =~ ^${PHP_MINOR}\.[0-9]+$ ]]; then
            echo "error: unexpected PHP version from base image: $PATCH (expected ${PHP_MINOR}.x)" >&2
            exit 1
          fi
          echo "patch=$PATCH" >> "$GITHUB_OUTPUT"
          echo "Resolved PHP patch: $PATCH"

      - name: Build image from Dockerfile.alpine-release
        env:
          PHP_MINOR: ${{ matrix.php }}
          ALPINE_VER: ${{ matrix.alpine }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx build \
            --platform "linux/${ARCH}" \
            --file Dockerfile.alpine-release \
            --build-arg "PHP_VERSION=${PHP_MINOR}" \
            --build-arg "ALPINE_VERSION=${ALPINE_VER}" \
            --build-arg "OXPHP_VERSION=${VERSION}" \
            --cache-from "type=gha,scope=release-${ARCH}-${PHP_MINOR}" \
            --cache-to "type=gha,scope=release-${ARCH}-${PHP_MINOR},mode=max" \
            --load \
            -t oxphp:ci \
            .

      - name: Smoke test
        env:
          EXPECTED_PHP: ${{ steps.php_patch.outputs.patch }}
        run: |
          ./scripts/smoke-test-image.sh oxphp:ci "$EXPECTED_PHP"

      - name: Push arch-specific minor-floating tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PHP_MINOR: ${{ matrix.php }}
          ALPINE_VER: ${{ matrix.alpine }}
          ARCH: ${{ matrix.arch }}
        run: |
          TAG="${REGISTRY}/${IMAGE_NAME}:${VERSION}-php${PHP_MINOR}-alpine${ALPINE_VER}-${ARCH}"
          docker tag oxphp:ci "$TAG"
          docker push "$TAG"

      - name: Push arch-specific patch-pinned tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PHP_PATCH: ${{ steps.php_patch.outputs.patch }}
          ALPINE_VER: ${{ matrix.alpine }}
          ARCH: ${{ matrix.arch }}
        run: |
          TAG="${REGISTRY}/${IMAGE_NAME}:${VERSION}-php${PHP_PATCH}-alpine${ALPINE_VER}-${ARCH}"
          docker tag oxphp:ci "$TAG"
          docker push "$TAG"

      - name: Record PHP patch for manifest-merge step
        env:
          PHP_PATCH: ${{ steps.php_patch.outputs.patch }}
          PHP_MINOR: ${{ matrix.php }}
          ALPINE_VER: ${{ matrix.alpine }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p /tmp/outputs
          echo "$PHP_PATCH" > "/tmp/outputs/php_patch_${PHP_MINOR}_${ALPINE_VER}_${ARCH}.txt"

      - name: Upload PHP patch artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-patch-${{ matrix.php }}-${{ matrix.alpine }}-${{ matrix.arch }}
          path: /tmp/outputs/php_patch_${{ matrix.php }}_${{ matrix.alpine }}_${{ matrix.arch }}.txt
          retention-days: 1

  # ──────────────────────────────────────────────────────────────
  # Job 1.5: pre-publish gate — focused PHP integration suite
  #
  # Runs a curated subset of tests/run_all.sh (suites known to be green on
  # main) against the just-built amd64 image for each PHP version.
  # Skips arm64 — qemu emulation is slow and the codepaths exercised here
  # are arch-independent at the integration level. Failure aborts manifest
  # creation and alias-flip, so latest/{ver} users never see a regressed
  # image.
  #
  # Suite list intentionally excludes:
  #   - shared/*    — pre-existing baseline failures (HTTP 500 from PHP)
  #   - streaming/* — pre-existing test_stream_flush failure
  #   - profiler/*  — pre-existing internal_routes failure
  #   - worker/*    — pre-existing shared-state tests under worker mode
  # When those land green, expand the suite list here.
  # ──────────────────────────────────────────────────────────────
  php-suite:
    needs: build
    strategy:
      fail-fast: true
      matrix:
        include:
          - { php: "8.4", alpine: "3.23" }
          - { php: "8.5", alpine: "3.23" }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract oxphp version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pull just-built amd64 image and tag as oxphp:dev
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PHP_MINOR: ${{ matrix.php }}
          ALPINE_VER: ${{ matrix.alpine }}
        run: |
          # build job pushed `${VERSION}-php${PHP_MINOR}-alpine${ALPINE_VER}-amd64`.
          # tests/compose.*.yml expect `oxphp:dev` locally — re-tag to match.
          SRC="${REGISTRY}/${IMAGE_NAME}:${VERSION}-php${PHP_MINOR}-alpine${ALPINE_VER}-amd64"
          docker pull "$SRC"
          docker tag "$SRC" oxphp:dev

      - name: Run focused PHP integration suites
        env:
          PHP_VERSION: ${{ matrix.php }}
        run: |
          set -eo pipefail
          # Only run suites known to be green on main.
          # Add more here as baseline failures get fixed.
          SUITES=(
            headers
            cookies
            get_post_request
            input
            pathinfo
            errors
          )
          FAILED=()
          for suite in "${SUITES[@]}"; do
            echo "::group::Suite: $suite"
            if ! ./tests/run_all.sh --no-build --suite="$suite"; then
              FAILED+=("$suite")
            fi
            echo "::endgroup::"
          done
          if [[ ${#FAILED[@]} -gt 0 ]]; then
            echo "FAILED suites: ${FAILED[*]}" >&2
            exit 1
          fi

  # ──────────────────────────────────────────────────────────────
  # Job 2: per-(PHP, Alpine) manifest-list creation
  # ──────────────────────────────────────────────────────────────
  manifest:
    needs: [build, php-suite]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: "8.4", alpine: "3.23" }
          - { php: "8.5", alpine: "3.23" }
    outputs:
      canonical_minor_84: ${{ steps.canonicals.outputs.minor_84 }}
      canonical_patch_84: ${{ steps.canonicals.outputs.patch_84 }}
      canonical_minor_85: ${{ steps.canonicals.outputs.minor_85 }}
      canonical_patch_85: ${{ steps.canonicals.outputs.patch_85 }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract oxphp version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download PHP patch artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: php-patch-${{ matrix.php }}-${{ matrix.alpine }}-*
          path: /tmp/patches

      - name: Verify PHP patch consistency across arches
        id: patch
        env:
          PHP_MINOR: ${{ matrix.php }}
          ALPINE_VER: ${{ matrix.alpine }}
        run: |
          AMD=$(cat "/tmp/patches/php-patch-${PHP_MINOR}-${ALPINE_VER}-amd64/php_patch_${PHP_MINOR}_${ALPINE_VER}_amd64.txt")
          ARM=$(cat "/tmp/patches/php-patch-${PHP_MINOR}-${ALPINE_VER}-arm64/php_patch_${PHP_MINOR}_${ALPINE_VER}_arm64.txt")
          if [[ "$AMD" != "$ARM" ]]; then
            echo "error: PHP patch mismatch across arches. amd64=$AMD arm64=$ARM" >&2
            exit 1
          fi
          echo "patch=$AMD" >> "$GITHUB_OUTPUT"

      - name: Create minor-floating multi-arch manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PHP_MINOR: ${{ matrix.php }}
          ALPINE_VER: ${{ matrix.alpine }}
        run: |
          docker buildx imagetools create \
            -t "${REGISTRY}/${IMAGE_NAME}:${VERSION}-php${PHP_MINOR}-alpine${ALPINE_VER}" \
            "${REGISTRY}/${IMAGE_NAME}:${VERSION}-php${PHP_MINOR}-alpine${ALPINE_VER}-amd64" \
            "${REGISTRY}/${IMAGE_NAME}:${VERSION}-php${PHP_MINOR}-alpine${ALPINE_VER}-arm64"

      - name: Create patch-pinned multi-arch manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PHP_MINOR: ${{ matrix.php }}
          PHP_PATCH: ${{ steps.patch.outputs.patch }}
          ALPINE_VER: ${{ matrix.alpine }}
        run: |
          docker buildx imagetools create \
            -t "${REGISTRY}/${IMAGE_NAME}:${VERSION}-php${PHP_PATCH}-alpine${ALPINE_VER}" \
            "${REGISTRY}/${IMAGE_NAME}:${VERSION}-php${PHP_MINOR}-alpine${ALPINE_VER}-amd64" \
            "${REGISTRY}/${IMAGE_NAME}:${VERSION}-php${PHP_MINOR}-alpine${ALPINE_VER}-arm64"

      - name: Export canonical tag names
        id: canonicals
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PHP_MINOR: ${{ matrix.php }}
          PHP_PATCH: ${{ steps.patch.outputs.patch }}
          ALPINE_VER: ${{ matrix.alpine }}
        run: |
          SAFE_PHP=$(echo "$PHP_MINOR" | tr . _)
          echo "minor_${SAFE_PHP}=${REGISTRY}/${IMAGE_NAME}:${VERSION}-php${PHP_MINOR}-alpine${ALPINE_VER}" >> "$GITHUB_OUTPUT"
          echo "patch_${SAFE_PHP}=${REGISTRY}/${IMAGE_NAME}:${VERSION}-php${PHP_PATCH}-alpine${ALPINE_VER}" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────────────────
  # Job 3: cosign signing of canonical tags
  # ──────────────────────────────────────────────────────────────
  sign:
    needs: manifest
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign canonical tags
        env:
          CANONICAL_MINOR_84: ${{ needs.manifest.outputs.canonical_minor_84 }}
          CANONICAL_PATCH_84: ${{ needs.manifest.outputs.canonical_patch_84 }}
          CANONICAL_MINOR_85: ${{ needs.manifest.outputs.canonical_minor_85 }}
          CANONICAL_PATCH_85: ${{ needs.manifest.outputs.canonical_patch_85 }}
        run: |
          for TAG in "$CANONICAL_MINOR_84" "$CANONICAL_PATCH_84" \
                     "$CANONICAL_MINOR_85" "$CANONICAL_PATCH_85"; do
            if [[ -n "$TAG" ]]; then
              echo "Signing $TAG"
              cosign sign --yes "$TAG"
            fi
          done

  # ──────────────────────────────────────────────────────────────
  # Job 4: move aliases to newly-published canonicals
  # ──────────────────────────────────────────────────────────────
  aliases:
    needs: sign
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: "8.4", alpine: "3.23" }
          - { php: "8.5", alpine: "3.23" }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq
        run: |
          sudo curl -sL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Extract oxphp version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Move aliases
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PHP_MINOR: ${{ matrix.php }}
          ALPINE_VER: ${{ matrix.alpine }}
          REGISTRY_OVERRIDE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          REGISTRY="$REGISTRY_OVERRIDE" ./scripts/move-aliases.sh \
            "$VERSION" \
            "$PHP_MINOR" \
            "$ALPINE_VER"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign moved aliases (they now resolve to canonical digests)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PHP_MINOR: ${{ matrix.php }}
        run: |
          SEMVER_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
          LATEST_OXPHP=$(yq '.oxphp_versions[0]' .github/supported-versions.yml)
          DEFAULT_PHP=$(yq '.default_php' .github/supported-versions.yml)

          cosign sign --yes "${REGISTRY}/${IMAGE_NAME}:${VERSION}-php${PHP_MINOR}"
          cosign sign --yes "${REGISTRY}/${IMAGE_NAME}:${SEMVER_MINOR}-php${PHP_MINOR}"

          if [[ "$VERSION" == "$LATEST_OXPHP" ]]; then
            cosign sign --yes "${REGISTRY}/${IMAGE_NAME}:php${PHP_MINOR}"
            if [[ "$PHP_MINOR" == "$DEFAULT_PHP" ]]; then
              cosign sign --yes "${REGISTRY}/${IMAGE_NAME}:${VERSION}"
              cosign sign --yes "${REGISTRY}/${IMAGE_NAME}:latest"
            fi
          fi
