name: Nightly Build

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: oxphp/oxphp

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64

    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Platform suffix
        id: platform
        run: echo "suffix=${PLATFORM#linux/}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.alpine-release
          platforms: ${{ matrix.platform }}
          provenance: false
          push: true
          build-args: |
            PHP_VERSION=8.4
            ALPINE_VERSION=3.23
            OXPHP_VERSION=0.0.0-nightly-${{ github.sha }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:nightly-${{ steps.platform.outputs.suffix }}
          cache-from: type=gha,scope=nightly-${{ steps.platform.outputs.suffix }}
          cache-to: type=gha,scope=nightly-${{ steps.platform.outputs.suffix }},mode=max

  manifest:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t "$REGISTRY/$IMAGE_NAME:nightly" \
            "$REGISTRY/$IMAGE_NAME:nightly-amd64" \
            "$REGISTRY/$IMAGE_NAME:nightly-arm64"
