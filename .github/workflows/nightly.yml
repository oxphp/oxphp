name: Nightly Build

on:
  schedule:
    - cron: '0 2 * * *'   # daily 02:00 UTC
  workflow_dispatch:      # manual trigger, always builds

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: oxphp/oxphp
  # BuildKit layer cache lives in its own package, not in the Actions cache
  # (10 GB per repo, shared with the cargo caches of pr.yml).
  CACHE_IMAGE: oxphp/oxphp-buildcache

jobs:
  # Skip the scheduled run when main has not moved since the last green one.
  changes:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      build: ${{ steps.compare.outputs.build }}
    steps:
      - name: Compare HEAD with the last successful nightly
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST=$(gh run list -R "$GITHUB_REPOSITORY" --workflow nightly.yml \
            --branch main --status success --limit 1 --json headSha -q '.[0].headSha')
          if [[ "$LAST" == "$GITHUB_SHA" ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "main is still at $GITHUB_SHA; skipping build."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Building $GITHUB_SHA (last successful nightly: ${LAST:-none})"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: "8.4", arch: amd64, runner: ubuntu-latest }
          - { php: "8.4", arch: arm64, runner: ubuntu-24.04-arm }
          - { php: "8.5", arch: amd64, runner: ubuntu-latest }
          - { php: "8.5", arch: arm64, runner: ubuntu-24.04-arm }

    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Resolve the upstream PHP patch (full "8.4.20", not minor) because
      # smoke-test-image.sh does strict string equality against PHP_VERSION.
      - name: Resolve PHP patch version from base image
        id: php_patch
        env:
          PHP_MINOR: ${{ matrix.php }}
          ARCH: ${{ matrix.arch }}
        run: |
          BASE="php:${PHP_MINOR}-zts-alpine3.23"
          docker pull --platform "linux/${ARCH}" "$BASE"
          PATCH=$(docker run --rm --platform "linux/${ARCH}" "$BASE" php -r 'echo PHP_VERSION;')
          if [[ ! "$PATCH" =~ ^${PHP_MINOR}\.[0-9]+$ ]]; then
            echo "error: unexpected PHP version: $PATCH (expected ${PHP_MINOR}.x)" >&2
            exit 1
          fi
          echo "patch=$PATCH" >> "$GITHUB_OUTPUT"

      # Build and load locally first so the smoke gate runs before push.
      - name: Build (load locally, no push yet)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/release/alpine/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          provenance: false
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            ALPINE_VERSION=3.23
            OXPHP_VERSION=0.0.0-nightly-${{ github.sha }}
          tags: oxphp:ci
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE }}:php${{ matrix.php }}-nightly-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE }}:php${{ matrix.php }}-nightly-${{ matrix.arch }},mode=max,image-manifest=true,oci-mediatypes=true

      - name: Smoke test
        env:
          EXPECTED_PHP: ${{ steps.php_patch.outputs.patch }}
        run: ./scripts/smoke-test-image.sh oxphp:ci "$EXPECTED_PHP"

      - name: Tag and push
        env:
          PHP_MINOR: ${{ matrix.php }}
          ARCH: ${{ matrix.arch }}
        run: |
          TAG="${REGISTRY}/${IMAGE_NAME}:php${PHP_MINOR}-nightly-${ARCH}"
          docker tag oxphp:ci "$TAG"
          docker push "$TAG"

  manifest:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create php-specific multi-arch manifest
        env:
          PHP_MINOR: ${{ matrix.php }}
        run: |
          docker buildx imagetools create \
            -t "${REGISTRY}/${IMAGE_NAME}:php${PHP_MINOR}-nightly" \
            "${REGISTRY}/${IMAGE_NAME}:php${PHP_MINOR}-nightly-amd64" \
            "${REGISTRY}/${IMAGE_NAME}:php${PHP_MINOR}-nightly-arm64"

  alias:
    needs: manifest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `:nightly` resolves to the current default PHP minor. Bump
      # alongside the `ARG PHP_VERSION` default in
      # docker/release/alpine/Dockerfile when promoting a new minor.
      - name: Alias nightly -> php8.4-nightly
        run: |
          docker buildx imagetools create \
            -t "${REGISTRY}/${IMAGE_NAME}:nightly" \
            "${REGISTRY}/${IMAGE_NAME}:php8.4-nightly"
