# Supported version matrix for weekly rebuilds and release aliases.
#
# Read by:
#   - .github/workflows/weekly-rebuild.yml (rebuild matrix)
#   - scripts/move-aliases.sh              (alias destination resolution)
#
# Entries in oxphp_versions MUST be listed latest-first. The first entry is
# treated as "latest oxphp" and receives all latest-oriented aliases. The
# second entry is treated as "previous" and only receives version-scoped
# aliases (e.g. 0.3.0-php8.4, 0.3-php8.4).

oxphp_versions:
  - "0.13.0"  # latest
  - "0.12.0"  # previous

php_versions:
  - "8.4"
  - "8.5"

alpine_versions:
  - "3.23"

# Debian codenames the Debian image (docker/release/debian/Dockerfile) is
# published on. Its tags and aliases carry the codename (`php8.5-trixie`,
# and `trixie` in place of `latest`). An oxphp release whose tag has no
# docker/release/debian/Dockerfile is rebuilt on Alpine only.
debian_versions:
  - "trixie"

# The PHP version that receives the default-PHP aliases (`latest`,
# `0.13.0`, etc.). Must be present in php_versions. Bumped to a newer
# minor only after that version has soaked on the opt-in tags.
default_php: "8.5"
