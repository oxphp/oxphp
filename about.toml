# cargo-about config. Run locally:
#   cargo about generate about.hbs -o THIRD_PARTY_LICENSES.html
# CI regenerates and diffs against the committed file.

# Mirrors deny.toml [licenses].allow (kept in sync manually) plus the
# workspace's own AGPL-3.0-only — cargo-about renders licenses, it does not
# enforce policy. Enforcement against AGPL-as-dependency lives in deny.toml.
accepted = [
    "AGPL-3.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]

# Only runtime dependencies ship in the binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false

# Match the release image targets.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]

# zstd-sys declares only the license of its Rust bindings (MIT OR Apache-2.0),
# but its build script compiles a vendored copy of Meta's zstd C library into
# the binary. That code is BSD-3-Clause OR GPL-2.0, and this records that we
# take it under the first — so the choice is written down, and so a future
# tightening of `accepted` fails here instead of shipping GPL-2.0 terms by
# accident. The checksums pin the exact texts this was read from.
[zstd-sys]
clarify = { license = "MIT AND BSD-3-Clause", files = [
    { path = "LICENSE.Mit", license = "MIT", checksum = "129e8edef29e9abcd2ebabe252f4ef1b1289cdca356bf0040284a2fbccfb96c8" },
    { path = "zstd/LICENSE", license = "BSD-3-Clause", checksum = "7055266497633c9025b777c78eb7235af13922117480ed5c674677adc381c9d8" },
] }

# Per-crate clarifications get added here on first run if cargo-about cannot
# auto-resolve a crate's SPDX expression. Leave empty initially.
# [[crates]]
# name = "<crate>"
# version = "*"
# expression = "MIT OR Apache-2.0"
# license-files = [...]
