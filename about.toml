# cargo-about config. Run locally:
#   cargo about generate about.hbs -o THIRD_PARTY_LICENSES.html
# CI regenerates and diffs against the committed file.

# Mirrors deny.toml [licenses].allow (kept in sync manually) plus the
# workspace's own AGPL-3.0-only — cargo-about renders licenses, it does not
# enforce policy. Enforcement against AGPL-as-dependency lives in deny.toml.
accepted = [
    "AGPL-3.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]

# Only runtime dependencies ship in the binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false

# Match the release image targets.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]

# Per-crate clarifications get added here on first run if cargo-about cannot
# auto-resolve a crate's SPDX expression. Leave empty initially.
# [[crates]]
# name = "<crate>"
# version = "*"
# expression = "MIT OR Apache-2.0"
# license-files = [...]
