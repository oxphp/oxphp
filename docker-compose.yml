services:
  oxphp:
    build:
      context: .
      args:
        # Extra Cargo features (space-separated), e.g. "plugin-debug"
         CARGO_FEATURES: ""
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - ./www:/var/www/html:ro
      - ./oxphp.ini:/usr/local/etc/php/conf.d/oxphp.ini:ro
      - ./certs:/etc/ssl/oxphp:ro
    environment:
      # Server
      - LISTEN_ADDR=0.0.0.0:8080
      - DOCUMENT_ROOT=/var/www/html
      # - INDEX_FILE=index.php
      - WORKER_THREADS=0
      - EXECUTOR=sapi
      # PHP_WORKERS=0        # auto-detect (cpu*2, static)
      # PHP_WORKERS=8        # fixed 8 workers
      # PHP_WORKERS=2:0     # dynamic: 2 min, 16 max
      # PHP_WORKERS=14
      # - PHP_WORKERS_IDLE_SEC=30  # idle timeout for scale-down (dynamic only)
      # - QUEUE_CAPACITY=512

      # Logging
      - LOG_LEVEL=info

      # Internal server (health/metrics/config)
      - INTERNAL_ADDR=0.0.0.0:9090

      # Timeouts
      - HEADER_TIMEOUT_SECS=5
      - IDLE_TIMEOUT_SECS=60
      - REQUEST_TIMEOUT_SECS=120
      - DRAIN_TIMEOUT_SECS=30

      # Rate limiting (0 = off)
      # - RATE_LIMIT=0
      # - RATE_WINDOW=60

      # TLS
      # - TLS_CERT=/etc/ssl/oxphp/server.pem
      # - TLS_KEY=/etc/ssl/oxphp/server.key

      # Custom error pages
      # - ERROR_PAGES_DIR=/var/www/errors

      # Debug plugin (requires CARGO_FEATURES: "plugin-debug")
      # - DEBUG_VERBOSE=false
      # - DEBUG_INTERNAL_AUTH=admin:secret
    restart: unless-stopped
