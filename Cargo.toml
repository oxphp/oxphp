[package]
name = "oxphp"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "sync", "signal", "time", "io-util", "macros", "fs"] }

# HTTP server
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1"
http-body-util = "0.1"
bytes = "1"

# MIME type detection
mime_guess = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"

# Streaming response bodies
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = "0.1"
futures-util = "0.3"

# URL decoding
percent-encoding = "2"

# Lock-free bounded channel for worker pool
crossbeam-channel = "0.5"

# Concurrent hash map for rate limiting
dashmap = "6"

# Compression
brotli = "7"

# Error derives
thiserror = "2"

# C standard library (calloc/free for call_php arg buffers)
libc = "0.2"

# Fast allocator
mimalloc = "0.1"

# TLS
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
rustls-pemfile = "2"

# Base64 encoding (optional — used by example plugin)
base64 = { version = "0.22", optional = true }

[features]
default = ["php"]
php = []
plugin-example = ["base64"]

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3"
