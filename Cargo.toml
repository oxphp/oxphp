[package]
name = "oxphp"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt", "net", "sync", "signal", "time", "io-util", "macros", "fs"] }

# HTTP server
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1"
http-body-util = "0.1"

# MIME type detection
mime_guess = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# URL decoding
percent-encoding = "2"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3"
