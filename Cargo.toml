[package]
name = "oxphp"
version = "0.2.0"
edition = "2021"
description = "Asynchronous PHP application server"
license = "AGPL-3.0-only"
repository = "https://github.com/oxphp/oxphp"
homepage = "https://oxphp.dev"
rust-version = "1.91.1"
publish = false

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "sync", "signal", "time", "io-util", "macros", "fs"] }

# HTTP server
hyper = { version = "1.9", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1"
http-body-util = "0.1"
bytes = "1"

# MIME type detection
mime_guess = "2"

# Serialization
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"

# Streaming response bodies
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = "0.1"
futures-util = "0.3"

# URL decoding
percent-encoding = "2"

# Lock-free bounded channel for worker pool
crossbeam-channel = "0.5"

# Concurrent hash map for rate limiting
dashmap = "6"

# LRU cache
lru = "0.12"

# Compression
brotli = "7"

# HTTP date formatting (RFC 7231)
httpdate = "1"

# Error derives
thiserror = "2"

# C standard library (calloc/free for call_php arg buffers)
libc = "0.2"

# Fast allocator
mimalloc = "0.1"

# Cryptographic random bytes (trace ID / span ID generation)
getrandom = "0.2"

# TLS
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
rustls-pemfile = "2"

# Base64 encoding (optional — used by example plugin)
base64 = { version = "0.22", optional = true }

# OpenTelemetry (optional — used by otel plugin)
opentelemetry = { version = "0.27", optional = true }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.27", features = ["http-proto", "reqwest-client"], optional = true }
opentelemetry-semantic-conventions = { version = "0.27", optional = true }
tonic = { version = "0.12", optional = true }

[features]
default = ["php"]
php = []
plugin-example = ["base64"]
plugin-otel = ["opentelemetry", "opentelemetry_sdk", "opentelemetry-otlp", "opentelemetry-semantic-conventions", "tonic"]
plugin-apm = ["plugin-otel"]

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3"
