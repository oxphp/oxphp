[package]
name = "oxphp"
version = "0.11.0"
edition = "2021"
description = "Asynchronous PHP application server"
license = "AGPL-3.0-only"
repository = "https://github.com/oxphp/oxphp"
homepage = "https://oxphp.dev"
rust-version = "1.91.1"
publish = false

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "sync", "signal", "time", "io-util", "macros", "fs"] }

# HTTP server
hyper = { version = "1.9", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1"
http-body-util = "0.1"
bytes = "1"

# MIME type detection
mime_guess = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"

# Streaming response bodies
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = "0.1"
futures-util = "0.3"

# URL decoding
percent-encoding = "2"

# SIMD-accelerated byte search (used in URI classification hot path)
memchr = "2"

globset = "0.4"

# Lock-free bounded channel for worker pool
crossbeam-channel = "0.5"

# Concurrent hash map for rate limiting
dashmap = "6"

# LRU cache
lru = "0.18"

# Inline small-vector storage. Used by ProfilingContext to keep a
# seq → local_id map without heap-allocating for the common case
# of < 32 simultaneously open spans. Already pulled transitively
# (tokio etc.); listed explicitly to make the direct dep visible.
smallvec = "1"

# Lock-free Arc swap — used by the profiler filter registry to
# replace a global Mutex on the BEGIN-event hot path with a
# copy-on-write snapshot that readers load with a single atomic.
arc-swap = "1"

# pprof.proto encoding for the profiler exporter. Generated via
# prost-build at compile time from proto/pprof.proto.
prost = "0.13"

# Gzip compression. Encodes responses for clients that do not accept
# brotli, and the pprof exporter's payload (Content-Type:
# application/vnd.google.pprof+proto+gzip). The backend is a whole-build
# choice, so both use zlib-rs: a Rust rewrite of zlib that measured ~2x
# faster than miniz_oxide from ~16 KB up at the same output size, and
# needs neither a C toolchain nor zlib headers at build time. zlib-ng
# would be marginally faster still but requires cmake, which the Alpine
# builder image does not install.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

# Faster synchronization primitives (smaller uncontended cost than std::sync
# on Linux; used in the file cache's read-heavy hot path)
parking_lot = "0.12"

# Compression
brotli = "8"

# Zstandard. The coding dynamic responses are compressed with when the client
# accepts it: over real bodies above ~4 KB it comes within a few percent of
# brotli's per-request quality on size for well under half the CPU, and that
# margin widens rather than narrows on x86-64. Default features off — legacy-format decoding and the
# dictionary trainer are dead weight in a server that only ever compresses.
zstd = { version = "0.13", default-features = false }

# HTTP date formatting (RFC 7231)
httpdate = "1"

# Error derives
thiserror = "2"

# C standard library (calloc/free for call_php arg buffers)
libc = "0.2"

# CIDR matching for trusted proxies
ipnet = "2"

# Fast allocator
mimalloc = "0.1"

# Bitfield flags
bitflags = "2"

# Minimal CLI argument parsing
lexopt = "0.3"

# Cryptographic random bytes (trace ID / span ID generation)
getrandom = "0.4"

# TLS
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
rustls-pemfile = "2"

# OpenTelemetry (optional — used by otel plugin)
opentelemetry = { version = "0.31", optional = true }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.31", default-features = false, features = [
    "grpc-tonic",       # gRPC transport
    "http-proto",       # HTTP/protobuf transport
    "trace",            # SpanExporter — the only signal this plugin emits
    "internal-logs",    # otel self-diagnostics (channel/handshake debug lines)
    "reqwest-client",   # selects the async reqwest client build path
    "reqwest-rustls",   # → reqwest/rustls-tls-native-roots
    "tls-roots",        # → tls (tonic/tls-ring) + tonic/tls-native-roots
], optional = true }
opentelemetry-semantic-conventions = { version = "0.31", optional = true }
tonic = { version = "0.14", optional = true }

# Profiler plugin deps (optional — used by ox_profiler plugin)
rand = { version = "0.10", features = ["std_rng", "thread_rng"], optional = true }
subtle = { version = "2.6", optional = true }
# HTTP client for the optional remote export (PROFILER_EXPORT_URL).
# rustls-tls keeps the Alpine builder openssl-free (pure-Rust ring
# backend). Already in [dev-dependencies] for integration tests.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"], optional = true }

# Ordered hashmap (used by Shared\Array str-keyed storage)
indexmap = "2"

[features]
default = ["php"]
php = ["plugin-apm", "plugin-async", "plugin-profiler", "plugin-shared"]
plugin-otel = ["opentelemetry", "opentelemetry_sdk", "opentelemetry-otlp", "opentelemetry-semantic-conventions", "tonic"]
plugin-apm = ["plugin-otel"]
plugin-async = []
plugin-profiler = ["dep:rand", "dep:subtle", "dep:reqwest"]
# Shared primitives depend on synthetic promises (waker lists for Channel,
# Mutex::with(timeout), etc.), which live in the ox_async module.
plugin-shared = ["plugin-async"]
# Test-only: registers a repeatable, ALL-target decorator that surfaces its
# per-occurrence constructor argument to PHP, so the integration suite can
# exercise per-(name, scope) attribute-occurrence resolution end-to-end. Not
# part of `php`; enable explicitly for the decorators test image.
decorator-test = ["plugin-profiler"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[build-dependencies]
# Compiles bundled .proto files into Rust types at build time
# (pprof.proto for src/profiling/export/pprof.rs).
# Requires `protoc` on PATH. Alpine: `apk add --no-cache
# protobuf-dev`. macOS: `brew install protobuf`.
prost-build = "0.13"

[dev-dependencies]
bytes = "1"
# Decodes the gzip responses the compression suite asserts on. Same backend
# as the main dependency above — a build selects one for the whole crate.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# Decodes the zstd responses the compression suite asserts on.
zstd = { version = "0.13", default-features = false }
criterion = { version = "0.5", default-features = false, features = ["async_tokio"] }
h2 = "0.4"
http = "1"
loom = "0.7"
# Throwaway self-signed certs for TLS handshake tests — generated at test
# runtime so no private key (even a fake one) lives in the repository, where
# it would trip gitleaks/secret-scanning forever.
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
reqwest = { version = "0.13", features = ["json"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "compression_offload"
path = "benches/compression_offload.rs"
harness = false

[[bench]]
name = "synthetic_promise"
path = "benches/synthetic_promise.rs"
harness = false
required-features = ["plugin-async"]

[[bench]]
name = "channel_throughput"
path = "benches/shared/channel_throughput.rs"
harness = false
required-features = ["plugin-shared"]

[[bench]]
name = "channel_recv_fiber"
path = "benches/shared/channel_recv_fiber.rs"
harness = false
required-features = ["plugin-shared"]

[[bench]]
name = "map_set_many"
path = "benches/shared/map_set_many.rs"
harness = false
required-features = ["plugin-shared"]

[[bench]]
name = "pool_uncontested"
path = "benches/shared/pool_uncontested.rs"
harness = false
required-features = ["plugin-shared"]

[[bench]]
name = "record_op_overhead"
path = "benches/shared/record_op_overhead.rs"
harness = false
required-features = ["plugin-shared"]
