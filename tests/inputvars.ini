; Above PHP's default of 1000, so a limit that ignores this setting stops short
; of $_GET. php/inputvars/test_limit_follows_max_input_vars.php sends more
; parameters and cookies than this.
max_input_vars = 1200

; Going past the limit raises a warning while the superglobals are built, which
; on screen would land in front of the test's JSON body.
display_errors = 0
