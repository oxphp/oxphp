# A PHP fatal raised from inside a SAPI callback that is walking the
# per-request state.
#
# The callback behind `OxPHP\Http\Request::headers()` hands every header to PHP
# one at a time, so it allocates on the Zend heap while it is reading state the
# server owns. A request that arrives with a large header and drives the heap
# to its ceiling turns that into a fatal in exactly that spot — see
# php/bailout/test_headers_bailout.php.
#
# The profile is otherwise ordinary traditional routing; bailout.ini only caps
# memory_limit so the test's ballast loop stays small.
#
# Standalone usage:
#   docker compose -f compose.yml -f compose.bailout.yml up
services:
  oxphp-bailout:
    build:
      context: ..
      dockerfile: docker/dev/Dockerfile
    ports:
      - "80"
    networks: [test-net]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    environment:
      LOG_LEVEL: error
      INTERNAL_ADDR: 0.0.0.0:9090
      # One worker, so the survival test is answered by the same thread that
      # took the fatal — that thread is the one whose request state the bug
      # left unusable.
      PHP_WORKERS: 1
    volumes:
      - ../www:/var/www/html
      - ./php:/var/www/html/public/tests
      - ./bailout.ini:/usr/local/etc/php/conf.d/zz-bailout.ini:ro
