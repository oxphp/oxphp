# setlocale() between requests: traditional routing with two PHP workers.
#
# A test holds one worker for its whole run and sends its own requests to the
# server, so those land on the other worker — one at a time, the same thread
# every time. That is what lets a test change its locale and see what a request
# running at the same time on the other thread sees, and know that one request
# on that thread has fully ended before the next one there starts.
#
# Standalone usage:
#   docker compose -f compose.yml -f compose.locale.yml up
services:
  oxphp-locale:
    build:
      context: ..
      dockerfile: docker/dev/Dockerfile
      args:
        PHP_VERSION:
        BASE_IMAGE:
    ports:
      - "80"
    networks: [test-net]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    environment:
      LOG_LEVEL: error
      INTERNAL_ADDR: 0.0.0.0:9090
      PHP_WORKERS: 2
    volumes:
      - ../www:/var/www/html
      - ./php:/var/www/html/public/tests
