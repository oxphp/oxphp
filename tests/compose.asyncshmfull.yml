# oxphp_async() tasks with OPcache's shared memory full and its file cache on,
# so that OPcache loads scripts from the file cache into the memory of the
# request: one async worker, so that the tasks of both PHP workers run on one
# thread, and two PHP workers, so a test can send requests to this server while
# it blocks its own worker reading the response.
#
# asyncshmfull.ini sets opcache.file_cache and a small opcache.max_accelerated_files.
# A test fills OPcache's table, which stays full for as long as the server runs,
# so the profile has one test.
#
# Standalone usage:
#   docker compose -f compose.yml -f compose.asyncshmfull.yml up
services:
  oxphp-asyncshmfull:
    build:
      context: ..
      dockerfile: docker/dev/Dockerfile
      args:
        PHP_VERSION:
        BASE_IMAGE:
    ports:
      - "80"
    networks: [test-net]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    environment:
      LOG_LEVEL: error
      INTERNAL_ADDR: 0.0.0.0:9090
      ASYNC_WORKERS: 1
      PHP_WORKERS: "2"
    volumes:
      - ../www:/var/www/html
      - ./php:/var/www/html/public/tests
      - ./asyncshmfull.ini:/usr/local/etc/php/conf.d/zz-asyncshmfull.ini:ro
