# Shared-state subsystem switched off at the master switch.
#
# The only profile that runs with SHARED_ENABLED=false. It cannot share a
# profile with the shared suites: every one of those needs the classes this
# one asserts are absent.
#
# Standalone usage:
#   docker compose -f compose.yml -f compose.shared_off.yml up
services:
  oxphp-shared_off:
    build:
      context: ..
      dockerfile: docker/dev/Dockerfile
    ports:
      - "80"
    networks: [test-net]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    environment:
      LOG_LEVEL: error
      INTERNAL_ADDR: 0.0.0.0:9090
      SHARED_ENABLED: "false"
    volumes:
      - ../www:/var/www/html
      - ./php:/var/www/html/public/tests
