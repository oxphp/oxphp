# Runtime hooks in traditional mode: RUNTIME_HOOKS=1 + ASYNC_WORKERS=4.
# Native sleep()/usleep() and blocking tcp:// socket reads are hooked to
# fiber-suspending implementations.
# Task fibers exercise the hooked path; the request context has no fiber,
# so it exercises the original-handler fallback path.
#
# Standalone usage:
#   docker compose -f compose.yml -f compose.hooksclassic.yml up
services:
  # The peer for the net tests: a TLS server whose timing is set by the port. See
  # fixtures/net_peer/tls_peer.php for what each port does. A stock PHP image rather
  # than this build, so the peer can never be the thing being tested.
  hooksclassic-netpeer:
    image: php:8.4-zts-alpine3.23
    command: ["php", "/peer/tls_peer.php"]
    networks: [test-net]
    restart: "no"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 4436) ? 0 : 1);"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s
    volumes:
      - ./fixtures/net_peer:/peer:ro

  oxphp-hooksclassic:
    build:
      context: ..
      dockerfile: docker/dev/Dockerfile
      args:
        PHP_VERSION:
        BASE_IMAGE:
    depends_on:
      hooksclassic-netpeer:
        condition: service_healthy
    ports:
      - "80"
    networks: [test-net]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    environment:
      LOG_LEVEL: error
      INTERNAL_ADDR: 0.0.0.0:9090
      ASYNC_WORKERS: 4
      RUNTIME_HOOKS: "1"
      # The TLS peer the net tests connect to; the address that answers nothing is
      # derived from it in the tests.
      NET_PEER: hooksclassic-netpeer
    volumes:
      - ../www:/var/www/html
      - ./php:/var/www/html/public/tests
