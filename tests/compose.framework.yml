# Framework routing mode: INDEX_FILE=index.php.
# All requests are routed through the front controller (index.php).
# Direct .php access is blocked. The framework fixture replaces the public root.
#
# Standalone usage:
#   docker compose -f compose.yml -f compose.framework.yml up
services:
  oxphp-framework:
    build:
      context: ..
      dockerfile: docker/dev/Dockerfile
    ports:
      - "80"
    networks: [test-net]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    environment:
      LOG_LEVEL: error
      INTERNAL_ADDR: 0.0.0.0:9090
      INDEX_FILE: index.php
    volumes:
      - ./fixtures/framework:/var/www/html/public
      - ./fixtures/static:/var/www/html/public/assets
      - ./php:/var/www/html/public/tests
