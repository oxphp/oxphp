# Script code run on an async-pool thread: a task, or a Shared\Pool callback a
# task's acquire()/evict() runs. Worker mode, as the crash was first reported:
# the worker thread runs the entry file, and the pool's threads never do, so
# the functions and classes it declares exist only on the worker thread.
#
# One PHP worker, so every test file is included on the thread that ran the
# entry file. The ini preloads a library for the tests that run preloaded code
# in a task.
#
# Standalone usage:
#   docker compose -f compose.yml -f compose.asyncdecl.yml up
services:
  oxphp-asyncdecl:
    build:
      context: ..
      dockerfile: docker/dev/Dockerfile
      args:
        PHP_VERSION:
    ports:
      - "80"
    networks: [test-net]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    environment:
      LOG_LEVEL: error
      INTERNAL_ADDR: 0.0.0.0:9090
      WORKER_MODE_ENABLED: "true"
      ENTRY_FILE: /var/www/html/asyncdecl/worker.php
      ASYNC_WORKERS: 2
      PHP_WORKERS: "1"
    volumes:
      - ../www:/var/www/html
      - ./php:/var/www/html/public/tests
      - ./fixtures/asyncdecl:/var/www/html/asyncdecl
      - ./asyncdecl.ini:/usr/local/etc/php/conf.d/zz-asyncdecl.ini:ro
