# Timeout-suite test environment. The PHP-side `set_time_limit()` /
# `max_execution_time` ini drives cancellation; tests configure their own
# per-script budget.
#
# Standalone usage:
#   docker compose -f compose.yml -f compose.timeout.yml up
services:
  oxphp-timeout:
    build:
      context: ..
      dockerfile: docker/dev/Dockerfile
    ports:
      - "80"
    networks: [test-net]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    environment:
      LOG_LEVEL: error
      INTERNAL_ADDR: 0.0.0.0:9090
    volumes:
      - ../www:/var/www/html
      - ./php:/var/www/html/public/tests
