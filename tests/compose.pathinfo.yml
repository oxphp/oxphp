# PATH_INFO splitting profile.
# Verifies Traditional-mode PATH_INFO splitting (`/index.php/api/v1` →
# SCRIPT_NAME=`/index.php`, PATH_INFO=`/api/v1`). Splitting is now always-on
# in Traditional routing mode — no env switch required.
#
# Standalone usage:
#   docker compose -f compose.yml -f compose.pathinfo.yml up
services:
  oxphp-pathinfo:
    build:
      context: ..
      dockerfile: docker/dev/Dockerfile
    ports:
      - "80"
    networks: [test-net]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    environment:
      LOG_LEVEL: error
      INTERNAL_ADDR: 0.0.0.0:9090
    volumes:
      - ../www:/var/www/html
      - ./php:/var/www/html/public/tests
