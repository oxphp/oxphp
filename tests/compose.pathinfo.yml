# PATH_INFO splitting mode: SPLIT_PATH_INFO_ENABLED=true.
# Enables splitting the request URI into SCRIPT_NAME and PATH_INFO components,
# required by frameworks that embed routing data in the URL path (e.g. /index.php/route).
#
# Standalone usage:
#   docker compose -f compose.yml -f compose.pathinfo.yml up
services:
  oxphp-pathinfo:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "80"
    networks: [test-net]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    environment:
      LOG_LEVEL: error
      INTERNAL_ADDR: 0.0.0.0:9090
      SPLIT_PATH_INFO_ENABLED: "true"
    volumes:
      - ../www:/var/www/html
      - ./php:/var/www/html/public/tests:ro
