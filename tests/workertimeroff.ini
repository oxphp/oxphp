; No time limit, as a worker deployment often runs, with max_input_time left set,
; as php.ini-production and php.ini-development both leave it. Request startup
; arms the thread's timer for max_input_time and the script's start does not
; stop it when the limit it then sets is zero, so the worker's boot leaves that
; timer running into the requests it serves. Twelve seconds leaves the first
; request time to be in flight before it runs out, past a slow health check.
max_execution_time = 0
max_input_time = 12
