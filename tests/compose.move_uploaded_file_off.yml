# move_uploaded_file() disabled — what OxPHP\Http\UploadedFile::moveTo() does
# when it cannot move the file.
#
# Standalone usage:
#   docker compose -f compose.yml -f compose.move_uploaded_file_off.yml up
services:
  oxphp-move_uploaded_file_off:
    build:
      context: ..
      dockerfile: docker/dev/Dockerfile
      args:
        PHP_VERSION:
        BASE_IMAGE:
    ports:
      - "80"
    networks: [test-net]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    environment:
      INTERNAL_ADDR: 0.0.0.0:9090
    volumes:
      - ../www:/var/www/html
      - ./php:/var/www/html/public/tests
      - ./move_uploaded_file_off.ini:/usr/local/etc/php/conf.d/zz-move_uploaded_file_off.ini:ro
