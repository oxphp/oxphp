# Worker::current() outside worker mode, met while a request starts up:
# traditional routing with two PHP workers, session.auto_start on, and a
# preloaded class whose __wakeup calls Worker::current().
#
# PHP decodes an auto-started session inside php_request_startup, before OxPHP's
# own module has started the request, so the object it holds wakes up before any
# script runs. A test holds one worker for its whole run and sends its own
# requests to the server, so those land on the other worker — one at a time, the
# same thread every time.
#
# Standalone usage:
#   docker compose -f compose.yml -f compose.tradautostart.yml up
services:
  oxphp-tradautostart:
    build:
      context: ..
      dockerfile: docker/dev/Dockerfile
      args:
        PHP_VERSION:
    ports:
      - "80"
    networks: [test-net]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    environment:
      LOG_LEVEL: error
      INTERNAL_ADDR: 0.0.0.0:9090
      PHP_WORKERS: 2
    volumes:
      - ../www:/var/www/html
      - ./php:/var/www/html/public/tests
      - ./tradautostart.ini:/usr/local/etc/php/conf.d/zz-tradautostart.ini:ro
