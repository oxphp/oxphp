# Worker mode with the profiler on and native sleep() hooked, so two profiled
# requests can be alive on one PHP thread at the same time.
#
# The profiler keeps a request's span stack, its span counter and its
# truncation flag on the worker thread. Worker mode admits a new request while
# earlier ones are parked, so the two meet here and nowhere else in the matrix:
# `profiler` is traditional mode (no fibers), `hooks` multiplexes but has no
# profiler, and `fiberobs` installs the observer but never starts a profile.
#
# PHP_WORKERS=1 so the inner request a test issues against itself can only be
# served while that test is parked — which is the window the whole profile is
# about. ASYNC_WORKERS=1 and RUNTIME_HOOKS=1 are what make sleep() park a
# request fiber instead of blocking the thread.
#
# Standalone usage:
#   docker compose -f compose.yml -f compose.profilerfiber.yml up
services:
  oxphp-profilerfiber:
    build:
      context: ..
      dockerfile: docker/dev/Dockerfile
      args:
        CARGO_FEATURES: "plugin-apm,plugin-async,plugin-profiler"
    ports:
      - "80"
    networks: [test-net]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    environment:
      LOG_LEVEL: error
      INTERNAL_ADDR: 0.0.0.0:9090
      WORKER_FILE: /var/www/html/worker/worker_entry.php
      PHP_WORKERS: "1"
      ASYNC_WORKERS: 1
      RUNTIME_HOOKS: "1"
      PROFILER_ENABLED: "true"
      PROFILER_AUTH_TOKEN: "test-token"
      PROFILER_OUTPUT_DIR: "/tmp/oxphp-profiles"
      # One format keeps the run fast, and the collapsed export is the one
      # that carries frame names — which is what says whose spans a run holds.
      PROFILER_OUTPUT_FORMATS: "collapsed"
      # Reachable on purpose by one probe (test_cap_stays_with_its_request,
      # which burns past it before parking) and by nothing else: the busiest
      # other probe here opens a few dozen spans, so no run but that one is
      # anywhere near the cap.
      PROFILER_MAX_SPANS: "500"
    volumes:
      - ../www:/var/www/html
      - ./php:/var/www/html/public/tests
      - ./fixtures/worker:/var/www/html/worker
networks:
  test-net:
    driver: bridge
