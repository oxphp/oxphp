# Profiler mode: ox_profiler plugin enabled with a known token.
# Activated via X-OxPHP-Profile / OXPROF cookie / ?__oxprof=...
#
# Standalone usage:
#   docker compose -f compose.yml -f compose.profiler.yml up
services:
  oxphp-profiler:
    build:
      context: ..
      dockerfile: docker/dev/Dockerfile
      args:
        PHP_VERSION:
        # plugin-profiler is part of Cargo's default feature set, so an
        # empty CARGO_FEATURES would already include it. Listed explicitly
        # here to document the intent and to keep the build reproducible
        # if the default set changes.
        CARGO_FEATURES: "plugin-apm,plugin-async,plugin-profiler"
    ports:
      - "80"
    networks: [test-net]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    environment:
      LOG_LEVEL: error
      INTERNAL_ADDR: 0.0.0.0:9090
      PROFILER_ENABLED: "true"
      PROFILER_AUTH_TOKEN: "test-token"
      # Disk storage. Single format keeps the test fast and
      # the assertion (test_storage_files_present.php) targets only
      # the .collapsed extension.
      PROFILER_OUTPUT_DIR: "/tmp/oxphp-profiles"
      PROFILER_OUTPUT_FORMATS: "collapsed"
      # One worker, so every test in this profile runs on the same PHP
      # thread. The profiler's per-request bridge state is thread-local:
      # test_truncated_after_cap only proves that the truncation flag is
      # cleared between requests if it is guaranteed to run on the thread
      # that raised it.
      PHP_WORKERS: "1"
      # Low enough that a test can reach it in a fraction of a second
      # (test_truncated_over_cap), high enough that every other test in
      # this profile stays far under it. Measured across a full suite
      # run, the busiest profiled request is test_attr_sample at 48
      # spans, then test_truncated_deep_stack at 45 — a probe's span
      # count runs well above its own call count because the TestCase
      # assertion helpers are observed too. Tenfold margin, so nothing
      # else in the suite is truncated by this.
      PROFILER_MAX_SPANS: "500"
      # On so that the request id is replaced part-way through the request,
      # which is what makes test_source_index's "run_id embeds its own
      # request id" assertion a guard rather than a tautology: the run id is
      # minted at completion, and with tracing off nothing ever changes the
      # id between the two points, so that assertion holds even on a build
      # that mints it at admission. With tracing on, the stored request id is
      # `<trace_id[:16]>-<span_id[:8]>` and a run id minted at admission
      # embeds the discarded one. Also turns on TRACE_CONTEXT, which no test
      # in this profile reads.
      #
      # There is no collector on the test network, so each run logs one
      # BatchSpanProcessor.ExportError for the refused connection to
      # 127.0.0.1:4317. That line is expected and unrelated to any failure.
      OTEL_ENABLED: "true"
    volumes:
      - ../www:/var/www/html
      - ./php:/var/www/html/public/tests
