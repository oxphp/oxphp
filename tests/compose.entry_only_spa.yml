# DOCUMENT_ROOT switched off with a non-.php ENTRY_FILE: every URI gets that
# file, with its own MIME type, and nothing else in its directory is served.
#
# Standalone usage:
#   docker compose -f compose.yml -f compose.entry_only_spa.yml up
services:
  oxphp-entry_only_spa:
    build:
      context: ..
      dockerfile: docker/dev/Dockerfile
      args:
        PHP_VERSION:
    ports:
      - "80"
    networks: [test-net]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    environment:
      LOG_LEVEL: error
      INTERNAL_ADDR: 0.0.0.0:9090
      DOCUMENT_ROOT: "no"
      ENTRY_FILE: /srv/spa/index.html
    volumes:
      - ./fixtures/entry_only/spa:/srv/spa
