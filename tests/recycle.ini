; For recycle/test_rshutdown_fatal_*: the session the worker entry starts after
; its loop, where the worker's last response has already sent its headers.
; session_start() refuses to start once headers are out unless cookies are off,
; and neither directive can be changed by then. No other test in this profile
; uses a session.
session.use_cookies = 0
session.cache_limiter = ""
