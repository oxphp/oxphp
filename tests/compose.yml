# Base compose for PHP test suite.
# Usage: docker compose -f compose.yml -f compose.<profile>.yml up
# No fixed name: compose calls it <project>_test-net, so each compose project gets
# its own network and projects running side by side on one Docker host cannot
# block each other's `up`.
networks:
  test-net:

# Reference template (YAML anchors don't cross files — each override is self-contained)
#
# Every profile built from docker/dev/Dockerfile lists PHP_VERSION under
# build.args with no value: compose then takes it from the environment, so
# `PHP_VERSION=8.5 ./run_all.sh` builds on PHP 8.5, and leaves the argument out
# when the variable is unset, so the Dockerfile's own default applies. Compose
# passes a build only the arguments a service lists, so a profile without the
# key builds on that default whatever the environment says.
x-oxphp-base: &oxphp-base
  build:
    context: ..
    dockerfile: docker/dev/Dockerfile
    args:
      PHP_VERSION:
  networks: [test-net]
  restart: "no"
  healthcheck:
    test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/health"]
    interval: 2s
    timeout: 3s
    retries: 15
    start_period: 5s
