# Compile errors in worker mode under OPcache's default file_update_protection,
# which the dev image's custom.ini turns off. A worker opens its PHP request
# once, so OPcache's idea of the request time is the worker's boot, and a file
# written after that is compiled without caching, through a path that keeps
# OPcache's recording of errors outside its own bailout handling.
#
# One PHP worker so every request lands on the same thread, runtime hooks on so
# a request can park on a socket read while the worker serves its inner request.
#
# compilerecord.ini puts opcache.file_update_protection back to PHP's default.
#
# Standalone usage:
#   docker compose -f compose.yml -f compose.compilerecord.yml up
services:
  oxphp-compilerecord:
    build:
      context: ..
      dockerfile: docker/dev/Dockerfile
      args:
        PHP_VERSION:
        BASE_IMAGE:
    ports:
      - "80"
    networks: [test-net]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    environment:
      LOG_LEVEL: error
      INTERNAL_ADDR: 0.0.0.0:9090
      WORKER_MODE_ENABLED: "true"
      ENTRY_FILE: /var/www/html/worker/worker_entry.php
      PHP_WORKERS: "1"
      ASYNC_WORKERS: 1
      RUNTIME_HOOKS: "1"
      # The system allocator, which aborts on a block freed twice. PHP's own
      # allocator lets a second release of a large block pass unnoticed, and the
      # heap it corrupts fails only later, somewhere else.
      USE_ZEND_ALLOC: "0"
    volumes:
      - ../www:/var/www/html
      - ./php:/var/www/html/public/tests
      - ./fixtures/worker:/var/www/html/worker
      - ./compilerecord.ini:/usr/local/etc/php/conf.d/zz-compilerecord.ini:ro
