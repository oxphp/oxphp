; OPcache keeps scripts in shared memory with its file cache as a second level,
; and a hash table small enough for a test to fill: once it is full, OPcache
; keeps every further script in the memory of the request that compiled it or
; loaded it from the file cache. Under the JIT OPcache writes no file cache, and
; preloading would take entries of the table.
opcache.file_cache = /tmp
opcache.max_accelerated_files = 200
opcache.jit = disable
opcache.preload =
