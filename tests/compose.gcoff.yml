# Worker mode with the cycle collector switched off in php.ini
# (zend.enable_gc=0). The engine then never allocates its buffer of possible
# roots and keeps the collector's guard up for the whole process, which the
# worker's recovery from a fatal has to leave as it found it.
#
# Standalone usage:
#   docker compose -f compose.yml -f compose.gcoff.yml up
services:
  oxphp-gcoff:
    build:
      context: ..
      dockerfile: docker/dev/Dockerfile
      args:
        PHP_VERSION:
        BASE_IMAGE:
    ports:
      - "80"
    networks: [test-net]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    environment:
      LOG_LEVEL: error
      INTERNAL_ADDR: 0.0.0.0:9090
      WORKER_MODE_ENABLED: "true"
      ENTRY_FILE: /var/www/html/worker/worker_entry.php
      # One worker, so the probes run on the worker that took the fatal.
      PHP_WORKERS: "1"
    volumes:
      - ../www:/var/www/html
      - ./php:/var/www/html/public/tests
      - ./fixtures/worker:/var/www/html/worker
      - ./gcoff.ini:/usr/local/etc/php/conf.d/zz-gcoff.ini:ro
