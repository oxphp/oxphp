; Ten seconds, so that the one firing of the pool thread's execution timer falls
; late enough for a test to still have it ahead when it dispatches. The engine's
; own default for a server SAPI is 30, which would put the mark past the
; runner's 15-second per-request cap.
;
; It bounds each request of this profile too, counted from that request's own
; start. The test that holds a task across the mark has to outlast the limit to
; do so, and lifts its own request's deadline for exactly that reason.
max_execution_time = 10
