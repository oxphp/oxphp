# Runtime hooks in worker mode: RUNTIME_HOOKS=1, one PHP worker, one async
# worker. Native sleep()/usleep() and blocking tcp:// socket reads are hooked
# to fiber-suspending implementations; with a single worker thread on
# each pool, wall-clock assertions prove that hooked calls multiplex
# request/task fibers instead of blocking the thread.
#
# Standalone usage:
#   docker compose -f compose.yml -f compose.hooks.yml up
services:
  # The peer for the net tests: a TLS server whose timing is set by the port. See
  # fixtures/net_peer/tls_peer.php for what each port does. A stock PHP image rather
  # than this build, so the peer can never be the thing being tested.
  hooks-netpeer:
    image: php:8.4-zts-alpine3.23
    command: ["php", "/peer/tls_peer.php"]
    networks: [test-net]
    restart: "no"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 4436) ? 0 : 1);"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s
    volumes:
      - ./fixtures/net_peer:/peer:ro

  oxphp-hooks:
    build:
      context: ..
      dockerfile: docker/dev/Dockerfile
      args:
        PHP_VERSION:
    depends_on:
      hooks-netpeer:
        condition: service_healthy
    ports:
      - "80"
    networks: [test-net]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    environment:
      LOG_LEVEL: error
      INTERNAL_ADDR: 0.0.0.0:9090
      WORKER_FILE: /var/www/html/worker/worker_entry.php
      PHP_WORKERS: "1"
      ASYNC_WORKERS: 1
      RUNTIME_HOOKS: "1"
      # The TLS peer the net tests connect to; the address that answers nothing is
      # derived from it in the tests.
      NET_PEER: hooks-netpeer
      # Read by the worker entry script and applied to phar.readonly at boot,
      # over the 0 that hooks.ini puts in php.ini. Through the environment
      # rather than as a literal in the script: the literal would be interned
      # and would never reach the code path worker/test_phar_readonly_floor
      # exercises.
      OXPHP_TEST_PHAR_READONLY: "1"
    volumes:
      - ../www:/var/www/html
      - ./php:/var/www/html/public/tests
      - ./fixtures/worker:/var/www/html/worker
      - ./hooks.ini:/usr/local/etc/php/conf.d/zz-hooks.ini:ro
