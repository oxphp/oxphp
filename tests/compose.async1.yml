# Async workers mode with a SINGLE worker: ASYNC_WORKERS=1.
# A one-worker pool is the clean way to prove fan-out awaits (await_all /
# race / any) suspend cooperatively inside a task fiber instead of blocking
# the worker: with only one worker, a blocking fan-out await pins it and the
# nested tasks can never run (deadlock), whereas a fiber-suspending await
# frees the worker so the nested tasks complete.
#
# Standalone usage:
#   docker compose -f compose.yml -f compose.async1.yml up
services:
  oxphp-async1:
    build:
      context: ..
      dockerfile: docker/dev/Dockerfile
    ports:
      - "80"
    networks: [test-net]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    environment:
      LOG_LEVEL: error
      INTERNAL_ADDR: 0.0.0.0:9090
      ASYNC_WORKERS: 1
    volumes:
      - ../www:/var/www/html
      - ./php:/var/www/html/public/tests
