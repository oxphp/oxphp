# The curl category switched off while every other hook stays on:
# RUNTIME_HOOKS=sleep,streams,net, one PHP worker, one async worker — the value
# that keeps the behaviour of the releases before the category existed. The
# control for the curl tests in the hooks profile: the same transfers, run where
# nothing parks them, have to hold the worker thread for their full length, while
# the net category beside it still parks its own waits. A build in which the
# category gate does nothing passes every curl test there and fails the one here.
#
# Standalone usage:
#   docker compose -f compose.yml -f compose.hookscurloff.yml up
services:
  # See compose.hooks.yml: the peer is a stock PHP image running the same script.
  hookscurloff-netpeer:
    image: php:8.4-zts-alpine3.23
    command: ["php", "/peer/tls_peer.php"]
    networks: [test-net]
    restart: "no"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 4436) ? 0 : 1);"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s
    volumes:
      - ./fixtures/net_peer:/peer:ro

  oxphp-hookscurloff:
    build:
      context: ..
      dockerfile: docker/dev/Dockerfile
      args:
        PHP_VERSION:
        BASE_IMAGE:
    depends_on:
      hookscurloff-netpeer:
        condition: service_healthy
    ports:
      - "80"
    networks: [test-net]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    environment:
      LOG_LEVEL: error
      INTERNAL_ADDR: 0.0.0.0:9090
      WORKER_MODE_ENABLED: "true"
      ENTRY_FILE: /var/www/html/worker/worker_entry.php
      PHP_WORKERS: "1"
      ASYNC_WORKERS: 1
      RUNTIME_HOOKS: "sleep,streams,net"
      NET_PEER: hookscurloff-netpeer
    volumes:
      - ../www:/var/www/html
      - ./php:/var/www/html/public/tests
      - ./fixtures/worker:/var/www/html/worker
