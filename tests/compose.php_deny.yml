# PHP_DENY_DIRS with default 404 fallback.
# Traditional routing; a deny pattern blocks direct execution of PHP files
# under /uploads. Static assets under the same directory are unaffected.
#
# Standalone usage:
#   docker compose -f compose.yml -f compose.php_deny.yml up
services:
  oxphp-php_deny:
    build:
      context: ..
      dockerfile: docker/dev/Dockerfile
    ports:
      - "80"
    networks: [test-net]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    environment:
      LOG_LEVEL: error
      INTERNAL_ADDR: 0.0.0.0:9090
      PHP_DENY_DIRS: /uploads/**
    volumes:
      - ./fixtures/php_deny/public:/var/www/html/public
      - ./php:/var/www/html/public/tests
