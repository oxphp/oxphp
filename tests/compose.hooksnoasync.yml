# Worker mode with runtime hooks and no async pool — the server's default for
# ASYNC_WORKERS. As the fibers profile otherwise: one PHP worker, so every
# request lands on the same thread, and hooks on, so a request can park on a
# native sleep or socket read. What runs here is what must not depend on the
# pool being there.
#
# Standalone usage:
#   docker compose -f compose.yml -f compose.hooksnoasync.yml up
services:
  oxphp-hooksnoasync:
    build:
      context: ..
      dockerfile: docker/dev/Dockerfile
      args:
        PHP_VERSION:
    ports:
      - "80"
    networks: [test-net]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    environment:
      LOG_LEVEL: error
      INTERNAL_ADDR: 0.0.0.0:9090
      WORKER_MODE_ENABLED: "true"
      ENTRY_FILE: /var/www/html/worker/worker_entry.php
      PHP_WORKERS: "1"
      RUNTIME_HOOKS: "1"
      QUEUE_WAIT_TIMEOUT_MS: "10000"
    volumes:
      - ../www:/var/www/html
      - ./php:/var/www/html/public/tests
      - ./fixtures/worker:/var/www/html/worker
