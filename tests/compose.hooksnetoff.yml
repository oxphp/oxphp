# The net category switched off while the rest of the hooks stay on:
# RUNTIME_HOOKS=sleep,streams, one PHP worker, one async worker. The control for
# the net tests in the hooks profile — the same TLS waits, run where nothing parks
# them, have to hold the worker thread for their full length. A build in which the
# category gate does nothing passes every test there and fails the one here.
#
# Standalone usage:
#   docker compose -f compose.yml -f compose.hooksnetoff.yml up
services:
  # See compose.hooks.yml: the peer is a stock PHP image running the same script.
  hooksnetoff-netpeer:
    image: php:8.4-zts-alpine3.23
    command: ["php", "/peer/tls_peer.php"]
    networks: [test-net]
    restart: "no"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 4436) ? 0 : 1);"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s
    volumes:
      - ./fixtures/net_peer:/peer:ro

  oxphp-hooksnetoff:
    build:
      context: ..
      dockerfile: docker/dev/Dockerfile
      args:
        PHP_VERSION:
    depends_on:
      hooksnetoff-netpeer:
        condition: service_healthy
    ports:
      - "80"
    networks: [test-net]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    environment:
      LOG_LEVEL: error
      INTERNAL_ADDR: 0.0.0.0:9090
      WORKER_FILE: /var/www/html/worker/worker_entry.php
      PHP_WORKERS: "1"
      ASYNC_WORKERS: 1
      RUNTIME_HOOKS: "sleep,streams"
      NET_PEER: hooksnetoff-netpeer
    volumes:
      - ../www:/var/www/html
      - ./php:/var/www/html/public/tests
      - ./fixtures/worker:/var/www/html/worker
