# TLS mode: TLS_CERT and TLS_KEY point to PEM files mounted from fixtures/certs.
# The main listener serves HTTPS while the internal server (INTERNAL_ADDR) remains
# plain HTTP, so the healthcheck still uses http://127.0.0.1:9090/health.
#
# Standalone usage:
#   docker compose -f compose.yml -f compose.tls.yml up
services:
  oxphp-tls:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "80"
    networks: [test-net]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    environment:
      LOG_LEVEL: error
      INTERNAL_ADDR: 0.0.0.0:9090
      TLS_CERT: /etc/ssl/oxphp/cert.pem
      TLS_KEY: /etc/ssl/oxphp/key.pem
    volumes:
      - ../www:/var/www/html
      - ./php:/var/www/html/public/tests:ro
      - ./fixtures/certs:/etc/ssl/oxphp:ro
