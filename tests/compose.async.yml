# Async workers mode: ASYNC_WORKERS=4.
# Enables a pool of 4 dedicated threads for oxphp_async() promise execution.
# Used to test concurrent async task dispatch, results, and error propagation.
#
# Standalone usage:
#   docker compose -f compose.yml -f compose.async.yml up
services:
  oxphp-async:
    build:
      context: ..
      dockerfile: Dockerfile
    networks: [test-net]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    environment:
      LOG_LEVEL: error
      INTERNAL_ADDR: 0.0.0.0:9090
      ASYNC_WORKERS: 4
    volumes:
      - ../www:/var/www/html:ro
      - ./php:/var/www/html/tests:ro
