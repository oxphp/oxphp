# Async workers mode: ASYNC_WORKERS=4.
# Enables a pool of 4 dedicated threads for oxphp_async() promise execution.
# Used to test concurrent async task dispatch, results, and error propagation.
#
# Standalone usage:
#   docker compose -f compose.yml -f compose.async.yml up
services:
  oxphp-async:
    build:
      context: ..
      dockerfile: docker/dev/Dockerfile
      args:
        PHP_VERSION:
    ports:
      - "80"
    networks: [test-net]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    environment:
      LOG_LEVEL: error
      INTERNAL_ADDR: 0.0.0.0:9090
      ASYNC_WORKERS: 4
      # Two PHP workers whatever the host's core count (the CPU/2 default is 1
      # below 4 cores): tests here send a request to this server and block their
      # worker reading the response, which only a second worker can serve.
      PHP_WORKERS: "2"
    volumes:
      - ../www:/var/www/html
      - ./php:/var/www/html/public/tests
