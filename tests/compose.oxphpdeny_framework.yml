# .oxphpdeny in Framework routing: `>` rules hand requests to the front
# controller, deny rules run the PHP_DENY_FALLBACK script.
#
# Standalone usage:
#   docker compose -f compose.yml -f compose.oxphpdeny_framework.yml up
services:
  oxphp-oxphpdeny_framework:
    build:
      context: ..
      dockerfile: docker/dev/Dockerfile
      args:
        PHP_VERSION:
    ports:
      - "80"
    networks: [test-net]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    environment:
      LOG_LEVEL: error
      INTERNAL_ADDR: 0.0.0.0:9090
      ENTRY_FILE: index.php
      PHP_DENY_FALLBACK: /_security/denied.php
    volumes:
      - ./fixtures/oxphpdeny_framework/public:/var/www/html/public
      - ./php:/var/www/html/public/tests
