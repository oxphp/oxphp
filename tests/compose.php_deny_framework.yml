# PHP_DENY_DIRS is inert when INDEX_FILE is set (Framework mode).
# The server logs a startup warning and disables the deny-list. Any request
# — including /uploads/shell.php — is rewritten to the front controller
# (index.php). The fixture's index.php asserts the absence of
# OXPHP_DENIED_* $_SERVER keys to prove the deny check never fired.
#
# Standalone usage:
#   docker compose -f compose.yml -f compose.php_deny_framework.yml up
services:
  oxphp-php_deny_framework:
    build:
      context: ..
      dockerfile: docker/dev/Dockerfile
    ports:
      - "80"
    networks: [test-net]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    environment:
      LOG_LEVEL: error
      INTERNAL_ADDR: 0.0.0.0:9090
      INDEX_FILE: index.php
      PHP_DENY_DIRS: /uploads/**
    volumes:
      - ./fixtures/php_deny/public:/var/www/html/public
      - ./php:/var/www/html/public/tests
