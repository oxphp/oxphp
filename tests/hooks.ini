; phar.readonly is the one directive in this profile that has to come from
; php.ini rather than from the worker's bootstrap. Its handler remembers the
; value it sees at the startup stage and afterwards refuses every change that
; would relax it, so with the shipped default of 1 no request could lower it and
; worker/test_phar_readonly_floor would have nothing to measure. Build and CI
; images set it to 0 for exactly this reason — writing a phar needs it — and an
; application that then tightens it at bootstrap is what the test reproduces.
phar.readonly = 0
