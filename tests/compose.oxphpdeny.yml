# .oxphpdeny in Traditional routing with the default 404 fallback.
# The fixture docroot keeps what a legacy app often leaves there: vendor/,
# a database dump, composer.json.
#
# Standalone usage:
#   docker compose -f compose.yml -f compose.oxphpdeny.yml up
services:
  oxphp-oxphpdeny:
    build:
      context: ..
      dockerfile: docker/dev/Dockerfile
      args:
        PHP_VERSION:
    ports:
      - "80"
    networks: [test-net]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    environment:
      LOG_LEVEL: error
      INTERNAL_ADDR: 0.0.0.0:9090
    volumes:
      - ./fixtures/oxphpdeny/public:/var/www/html/public
      - ./php:/var/www/html/public/tests
