; OPcache with no shared memory: every script lives in the memory of the
; request that compiled it or loaded it from the file cache, as without OPcache,
; while OPcache stays on. Under the JIT OPcache writes no file cache, and
; preloading needs shared memory.
opcache.enable = 1
opcache.file_cache = /tmp
opcache.file_cache_only = 1
opcache.jit = disable
opcache.preload =
