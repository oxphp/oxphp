# Async workers with a single worker and unlimited C-level output buffering:
# ASYNC_WORKERS=1, output_buffering=On.
#
# Proves the worker discards a background task's accumulated PHP output buffer
# (and reclaims the allocation) once it goes idle, exposing the discarded byte
# count via oxphp_async_output_discarded_bytes_total.
#
# Standalone usage:
#   docker compose -f compose.yml -f compose.asyncob.yml up
services:
  oxphp-asyncob:
    build:
      context: ..
      dockerfile: docker/dev/Dockerfile
    ports:
      - "80"
    networks: [test-net]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    environment:
      LOG_LEVEL: error
      INTERNAL_ADDR: 0.0.0.0:9090
      ASYNC_WORKERS: 1
    volumes:
      - ../www:/var/www/html
      - ./php:/var/www/html/public/tests
      - ./asyncob.ini:/usr/local/etc/php/conf.d/zz-asyncob.ini:ro
