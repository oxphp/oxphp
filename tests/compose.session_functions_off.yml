# session_id() and session_name() disabled — what OxPHP\Http\Session::id()
# and name() return without them.
#
# Standalone usage:
#   docker compose -f compose.yml -f compose.session_functions_off.yml up
services:
  oxphp-session_functions_off:
    build:
      context: ..
      dockerfile: docker/dev/Dockerfile
      args:
        PHP_VERSION:
        BASE_IMAGE:
    ports:
      - "80"
    networks: [test-net]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    environment:
      INTERNAL_ADDR: 0.0.0.0:9090
    volumes:
      - ../www:/var/www/html
      - ./php:/var/www/html/public/tests
      - ./session_functions_off.ini:/usr/local/etc/php/conf.d/zz-session_functions_off.ini:ro
