# Shared\Pool and Worker::current() outside worker mode: traditional routing
# with two PHP workers.
#
# A test holds one worker for its whole run and sends its own requests to the
# server, so those land on the other worker — one at a time, the same thread
# every time. That is what lets a test put a pool's creating request and a later
# request on the same thread, or on two threads at once, and know which — and
# send consecutive requests to one thread to see what each of them was handed.
#
# Standalone usage:
#   docker compose -f compose.yml -f compose.pooltrad.yml up
services:
  oxphp-pooltrad:
    build:
      context: ..
      dockerfile: docker/dev/Dockerfile
      args:
        PHP_VERSION:
    ports:
      - "80"
    networks: [test-net]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    environment:
      LOG_LEVEL: error
      INTERNAL_ADDR: 0.0.0.0:9090
      PHP_WORKERS: 2
    volumes:
      - ../www:/var/www/html
      - ./php:/var/www/html/public/tests
