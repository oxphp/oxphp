# PHP_DENY_DIRS with explicit 403 status fallback.
# Same fixture as php_deny, but PHP_DENY_FALLBACK=403 — denied PHP requests
# return HTTP 403 instead of the default 404.
#
# Standalone usage:
#   docker compose -f compose.yml -f compose.php_deny_403.yml up
services:
  oxphp-php_deny_403:
    build:
      context: ..
      dockerfile: docker/dev/Dockerfile
    ports:
      - "80"
    networks: [test-net]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    environment:
      LOG_LEVEL: error
      INTERNAL_ADDR: 0.0.0.0:9090
      PHP_DENY_DIRS: /uploads/**
      PHP_DENY_FALLBACK: "403"
    volumes:
      - ./fixtures/php_deny/public:/var/www/html/public
      - ./php:/var/www/html/public/tests
