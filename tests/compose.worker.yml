# Worker mode: persistent PHP workers with a fixed entry file.
# The ENTRY_FILE script boots the application once; workers persist across
# requests without php_request_shutdown between them. Workers recycle on
# memory pressure (WORKER_MAX_MEMORY_MIB) or on explicit Worker::scheduleExit().
#
# Standalone usage:
#   docker compose -f compose.yml -f compose.worker.yml up
services:
  oxphp-worker:
    build:
      context: ..
      dockerfile: docker/dev/Dockerfile
      args:
        PHP_VERSION:
    ports:
      - "80"
    networks: [test-net]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    environment:
      LOG_LEVEL: error
      INTERNAL_ADDR: 0.0.0.0:9090
      WORKER_MODE_ENABLED: "true"
      ENTRY_FILE: /var/www/html/worker/worker_entry.php
      # shared/test_channel_fiber_producer_consumer + shutdown_drain dispatch
      # producers/consumers via oxphp_async(); without async workers the pool
      # is disabled and they fatally throw OxPHP\Async\AsyncException.
      ASYNC_WORKERS: 4
      # Two PHP workers whatever the host's core count (the CPU/2 default is 1
      # below 4 cores): a test here sends a request to this server and blocks its
      # worker reading the response — without RUNTIME_HOOKS the read does not
      # suspend the request — which only a second worker can serve.
      PHP_WORKERS: "2"
    volumes:
      - ../www:/var/www/html
      - ./php:/var/www/html/public/tests
      - ./fixtures/worker:/var/www/html/worker
